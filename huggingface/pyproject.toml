[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "download-models"
version = "0.1.0"
description = "Download models defined in a huggingface.yaml lock file"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "huggingface_hub>=0.14.0",
    "PyYAML>=6.0",
]

[project.scripts]
download-models = "download_models.download_models:main"

[project.urls]
Homepage = "https://github.com/yourusername/download-models"
Repository = "https://github.com/yourusername/download-models"