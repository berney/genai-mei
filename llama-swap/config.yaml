models:
  # --------------------------------------------------------------------------------
  # Jesse's framework-ai-cachyos
  # --------------------------------------------------------------------------------

  # ================= Always-on Models =================
  # Jesse is using Q6_K_XL
  qwen3-4b-q6:
    name: "Qwen3-4B-128K-Q6_K_XL"
    description: "Fast small model for quick tasks"
    cmd: podman compose up qwen3-4b-128k-q6
    cmdStop: podman compose stop qwen3-4b-128k-q6
    proxy: http://qwen3-4b-128k-q6:8080
    ttl: 0
    aliases: ["small-q6", "fast-q6", "quick-q6", "instant-q6", "small", "fast", "quick", "instant"]

  qwen3-4b-q6-voice:
    name: "Qwen3-4B-128K-Q6_K_XL Reasoning Off"
    description: "Voice chat"
    cmd: podman compose up qwen3-4b-128k-q6-voice
    cmdStop: podman compose stop qwen3-4b-128k-q6-voice
    proxy: http://qwen3-4b-128k-q6-voice:8080
    ttl: 0
    aliases: ["voice"]

  # I want to test Q8_K_XL
  qwen3-4b-q8:
    name: "Qwen3-4B-128K-Q8_K_XL"
    description: "Fast small model for quick tasks"
    cmd: podman compose up qwen3-4b-128k-q8
    cmdStop: podman compose stop qwen3-4b-128k-q8
    proxy: http://qwen3-4b-128k-q8:8080
    ttl: 0
    aliases: ["small-q8", "fast-q8", "quick-q8", "instant-q8"]


  # Large uncensored model
  heretic-gpt-oss-120b:
    name: "Heretic-GPT-OSS-120B"
    description: "Large uncensored general model"
    cmd: podman compose up heretic-gpt-oss-120b
    cmdStop: podman compose stop heretic-gpt-oss-120b
    proxy: http://heretic-gpt-oss-120b:8080
    ttl: 600
    aliases: ["heretic", "uncensored", "gpt-oss", "gpt-120b"]

  heretic-gpt-oss-120b-q8:
    name: "Heretic-GPT-OSS-120B-Q8_0"
    description: "Large uncensored general model"
    cmd: podman compose up heretic-gpt-oss-120b-q8
    cmdStop: podman compose stop heretic-gpt-oss-120b-q8
    proxy: http://heretic-gpt-oss-120b-q8:8080
    ttl: 600
    aliases: ["heretic-q8", "uncensored-q8", "gpt-oss-q8", "gpt-120b-8q"]

  qwen3-coder-30b:
    name: "Qwen3-Coder-30B-A3B"
    description: "Best coding model - MoE 30B/3B active"
    cmd: podman compose up qwen3-coder-30b
    cmdStop: podman compose stop qwen3-coder-30b
    proxy: http://qwen3-coder-30b:8080
    ttl: 900
    #aliases: ["coder", "coding", "code", "dev", "default"]
    aliases: ["qwen3-coder-30b-a3b", "qwen3-coder-30b", "qwen3-coder", "qwen3"]

  # --------------------------------------------------------------------------------
  # New
  # --------------------------------------------------------------------------------
  qwen3-coder-next:
    name: unsloth/Qwen3-Coder-Next-GGUF
    description: |
      An open-weight language model designed specifically for coding agents and local development.

        - *Super Efficient with Significant Performance:* With only 3B activated parameters (80B total parameters), it achieves performance comparable to models with 10–20x more active parameters, making it highly cost-effective for agent deployment.
        - *Advanced Agentic Capabilities:* Through an elaborate training recipe, it excels at long-horizon reasoning, complex tool usage, and recovery from execution failures, ensuring robust performance in dynamic coding tasks.
        - *Versatile Integration with Real-World IDE:* Its 256k context length, combined with adaptability to various scaffold templates, enables seamless integration with different CLI/IDE platforms (e.g., Claude Code, Qwen Code, Qoder, Kilo, Trae, Cline, etc.), supporting diverse development environments.
    cmd: podman compose up qwen3-coder-next
    cmdStop: podman compose stop qwen3-coder-next
    proxy: http://qwen3-coder-next:8080
    ttl: 3600

  qwen3.6-35B-A3B:
    name: unsloth/Qwen3.6-35B-A3B
    description: |
      MoE model (35B total / 3B active), featuring:
      - exceptional agentic coding capability competitive with much larger models
      - strong multimodal perception and reasoning ability
    cmd: podman compose up qwen36-35B-A3B
    cmdStop: podman compose stop qwen36-35B-A3B
    proxy: http://qwen36-35b-a3b:8080
    ttl: 3600

  qwen3.6-35B-A3B-MTP:
    name: unsloth/Qwen3.6-35B-A3B-MTP
    description: |
      MoE model (35B total / 3B active), featuring:
      - exceptional agentic coding capability competitive with much larger models
      - strong multimodal perception and reasoning ability
    cmd: podman compose up qwen36-35B-A3B-MTP
    cmdStop: podman compose stop qwen36-35B-A3B-MTP
    proxy: http://qwen36-35b-a3b-mtp:8080
    ttl: 3600
    aliases:
      - claude-sonnet-4-6
      - claude-haiku-4-5
      - claude-haiku-4-5-20251001
      - claude-opus-4-7

  glm-4.7-flash:
    name: "unsloth/GLM-4.7-Flash-GGUF"
    description: |
      GLM-4.7-Flash is a 30B-A3B MoE model.
      As the strongest model in the 30B class, GLM-4.7-Flash offers a new option for lightweight deployment that balances performance and efficiency.
    cmd: podman compose up glm-4.7-flash
    cmdStop: podman compose stop glm-4.7-flash
    proxy: http://glm-4.7-flash:8080
    ttl: 3600
    aliases: ["glm", "glm-4.7", "coding", "coder", "code", "dev", "default"]

  # --------------------------------------------------------------------------------
  # Multi Modal
  # --------------------------------------------------------------------------------
  qwen2.5-omni-7b:
    name: unsloth/Qwen2.5-Omni-7B-GGUF
    description: |
      An end-to-end multimodal model designed to perceive diverse modalities, including text, images, audio, and video, while simultaneously generating text and natural speech responses in a streaming manner.
    cmd: podman compose up qwen2.5-omni-7b
    cmdStop: podman compose stop qwen2.5-omni-7b
    proxy: http://qwen2.5-omni-7b:8080
    ttl: 3600
    aliases: ["qwen2.5-omni", "omni", "multimodal", "mutli-modal"]

  glm-4.6v-flash:
    name: unsloth/GLM-4.6V-Flash-GGUF
    description: |
      GLM-4.6V series model includes two versions: GLM-4.6V (106B), a foundation model designed for cloud and high-performance cluster scenarios, and GLM-4.6V-Flash (9B), a lightweight model optimized for local deployment and low-latency applications. GLM-4.6V scales its context window to 128k tokens in training, and achieves SoTA performance in visual understanding among models of similar parameter scales. Crucially, we integrate native Function Calling capabilities for the first time. This effectively bridges the gap between "visual perception" and "executable action" providing a unified technical foundation for multimodal agents in real-world business scenarios.
    cmd: podman compose up glm-4.6v-flash
    cmdStop: podman compose stop glm-4.6v-flash
    proxy: http://glm-4.6v-flash:8080
    ttl: 3600
    aliases: ["pdf"]


  # --------------------------------------------------------------------------------
  kokoro-tts:
    name: "kokoro TTS"
    useModelName: "tts-1"
    cmd: podman compose up kokoro-tts
    cmdStop: podman compose stop kokoro-tts
    proxy: http://kokoro-tts:8880
    ttl: 0
    aliases: ["kokoro", "tts", "tts-1"]

  kokoro-tts-rocm:
    name: "kokoro TTS ROCm"
    useModelName: "tts-1"
    cmd: podman compose up kokoro-tts-rocm
    cmdStop: podman compose stop kokoro-tts-rocm
    proxy: http://kokoro-tts-rocm:8880
    ttl: 0
    aliases: ["kokoro-rocm", "tts-rocm", "tts-1-rocm"]

  # https://github.com/mostlygeek/llama-swap/issues/41#issuecomment-2722637867
  whisper:
    # needed
    checkEndpoint: /v1/audio/transcriptions/
    cmd: podman compose up whisper.cpp
    cmdStop: podman compose stop whisper.cpp
    proxy: http://whisper.cpp:8080
    #proxy: "http://host.containers.internal:8999"
    aliases: ["whisper.cpp", "stt"]
    ttl: 0

