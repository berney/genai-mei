models:
  # --------------------------------------------------------------------------------
  # Jesse's framework-ai-cachyos
  # --------------------------------------------------------------------------------

  qwen-coder-30b:
    name: "Qwen3-Coder-30B-A3B"
    description: "Best coding model - MoE 30B/3B active"
    cmd: podman compose up qwen-coder-30b
    cmdStop: podman compose stop qwen-coder-30b
    proxy: http://qwen-coder-30b:8130
    ttl: 900
    #aliases: ["coder", "coding", "code", "dev", "default"]
    aliases: ["qwen3", "qwen3-coder"]

  # Large uncensored model
  heretic-gpt-oss-120b:
    name: "Heretic-GPT-OSS-120B"
    description: "Large uncensored general model"
    cmd: podman compose up heretic-gpt-oss-120b
    cmdStop: podman compose stop heretic-gpt-oss-120b
    proxy: http://heretic-gpt-oss-120b:8120
    ttl: 600
    aliases: ["heretic", "uncensored", "gpt-oss", "gpt-120b"]


  # --------------------------------------------------------------------------------
  # New
  # --------------------------------------------------------------------------------
  glm-4.7-flash:
    name: "unsloth/GLM-4.7-Flash-GGUF"
    description: |
      GLM-4.7-Flash is a 30B-A3B MoE model.
      As the strongest model in the 30B class, GLM-4.7-Flash offers a new option for lightweight deployment that balances performance and efficiency.
    cmd: podman compose up glm-4.7-flash
    cmdStop: podman compose stop glm-4.7-flash
    proxy: http://glm-4.7-flash:8140
    ttl: 3600
    aliases: ["glm", "glm-4.7", "coding", "coder", "code", "dev", "default"]


