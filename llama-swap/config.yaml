models:
  # --------------------------------------------------------------------------------
  # Jesse's framework-ai-cachyos
  # --------------------------------------------------------------------------------

  # ================= Always-on Models =================
  # Jesse is using Q6_K_XL
  qwen3-4b-q6:
    name: "Qwen3-4B-128K-Q6_K_XL"
    description: "Fast small model for quick tasks"
    cmd: podman compose up qwen3-4b-128k-q6
    cmdStop: podman compose stop qwen3-4b-128k-q6
    proxy: http://qwen3-4b-128k-q6:8080
    ttl: 0
    aliases: ["small-q6", "fast-q6", "quick-q6", "instant-q6", "small", "fast", "quick", "instant"]

  qwen3-4b-q6-voice:
    name: "Qwen3-4B-128K-Q6_K_XL Reasoning Off"
    description: "Voice chat"
    cmd: podman compose up qwen3-4b-128k-q6-voice
    cmdStop: podman compose stop qwen3-4b-128k-q6-voice
    proxy: http://qwen3-4b-128k-q6-voice:8080
    ttl: 0
    aliases: ["voice"]

  # I want to test Q8_K_XL
  qwen3-4b-q8:
    name: "Qwen3-4B-128K-Q8_K_XL"
    description: "Fast small model for quick tasks"
    cmd: podman compose up qwen3-4b-128k-q8
    cmdStop: podman compose stop qwen3-4b-128k-q8
    proxy: http://qwen3-4b-128k-q8:8080
    ttl: 0
    aliases: ["small-q8", "fast-q8", "quick-q8", "instant-q8"]

  qwen3.6-35B-A3B:
    name: unsloth/Qwen3.6-35B-A3B
    description: |
      MoE model (35B total / 3B active), featuring:
      - exceptional agentic coding capability competitive with much larger models
      - strong multimodal perception and reasoning ability
    cmd: podman compose up qwen36-35B-A3B
    cmdStop: podman compose stop qwen36-35B-A3B
    proxy: http://qwen36-35b-a3b:8080
    ttl: 3600

  qwen3.6-35B-A3B-MTP:
    name: unsloth/Qwen3.6-35B-A3B-MTP
    description: |
      MoE model (35B total / 3B active), featuring:
      - exceptional agentic coding capability competitive with much larger models
      - strong multimodal perception and reasoning ability
    cmd: podman compose up qwen36-35B-A3B-MTP
    cmdStop: podman compose stop qwen36-35B-A3B-MTP
    proxy: http://qwen36-35b-a3b-mtp:8080
    ttl: 3600
    aliases:
      #- claude-sonnet-5
      #- claude-sonnet-4-6
      #- claude-haiku-4-5
      #- claude-haiku-4-5-20251001
      #- claude-opus-4-7
      #- claude-opus-4-8
      - coding
      - coder
      - code
      - dev
      - default

    filters:
      setParamsByID:
        "${MODEL_ID}":
          temperature: 0.6
          top_k: 20
          top_p: 0.95
          min_p: 0.0
          presence_penalty: 0.0
          chat_template_kwargs:
            enable_thinking: true
        "${MODEL_ID}:nothink":
          temperature: 0.7
          top_k: 20
          top_p: 0.8
          min_p: 0.0
          presence_penalty: 1.5
          chat_template_kwargs:
            enable_thinking: false
        "${MODEL_ID}:precise":
          temperature: 0.1
          top_k: 20
          top_p: 0.95
          min_p: 0.g
          gin_p: 0.0
          presence_penalty: 0.0
          #chat_template_kwargs:
          #  # should be default
          #  enable_thinking: true
        "${MODEL_ID}:precise-preserve-thinking":
          temperature: 0.1
          top_k: 20
          top_p: 0.95
          min_p: 0.g
          gin_p: 0.0
          presence_penalty: 0.0
          chat_template_kwargs:
            # should be default
            #enable_thinking: true
            preserve_thinking: true
        "${MODEL_ID}:precise-instruct":
          temperature: 0.1
          top_k: 20
          top_p: 0.95
          min_p: 0.g
          gin_p: 0.0
          presence_penalty: 0.0
          chat_template_kwargs:
            enable_thinking: false
        "${MODEL_ID}:creative":
          temperature: 1.0
          top_k: 20
          top_p: 0.95
          min_p: 0.0
          presence_penalty: 0.5
          chat_template_kwargs:
            enable_thinking: false

  # --------------------------------------------------------------------------------
  qwen3.8-27B-q4:
    name: "unsloth/Qwen3.8-27B (Q4_K_XL)"
    cmd: podman compose up qwen3.8-27B-q4
    cmdStop: podman compose stop qwen3.8-27B-q4
    proxy: http://qwen3.8-27B-q4:8080
    ttl: 3600

    filters:
      setParamsByID:
        "${MODEL_ID}":
          temperature: 1.0
          top_k: 20
          top_p: 0.95
          min_p: 0.0
          presence_penalty: 0.0
          chat_template_kwargs:
            enable_thinking: true
        "${MODEL_ID}:instruct":
          temperature: 0.7
          top_k: 20
          top_p: 0.80
          min_p: 0.0
          presence_penalty: 1.5
          chat_template_kwargs:
            enable_thinking: false

  qwen3.8-27B-q6:
    name: "unsloth/Qwen3.8-27B (Q6_K_XL)"
    cmd: podman compose up qwen3.8-27B-q6
    cmdStop: podman compose stop qwen3.8-27B-q6
    proxy: http://qwen3.8-27B-q6:8080
    ttl: 3600

    filters:
      setParamsByID:
        "${MODEL_ID}":
          temperature: 1.0
          top_k: 20
          top_p: 0.95
          min_p: 0.0
          presence_penalty: 0.0
          chat_template_kwargs:
            enable_thinking: true
        "${MODEL_ID}:instruct":
          temperature: 0.7
          top_k: 20
          top_p: 0.80
          min_p: 0.0
          presence_penalty: 1.5
          chat_template_kwargs:
            enable_thinking: false

  qwen3.8-27B-q8:
    name: "unsloth/Qwen3.8-27B (Q8_0)"
    cmd: podman compose up qwen3.8-27B-q8
    cmdStop: podman compose stop qwen3.8-27B-q8
    proxy: http://qwen3.8-27B-q8:8080
    ttl: 3600

    filters:
      setParamsByID:
        "${MODEL_ID}":
          temperature: 1.0
          top_k: 20
          top_p: 0.95
          min_p: 0.0
          presence_penalty: 0.0
          chat_template_kwargs:
            enable_thinking: true
        "${MODEL_ID}:instruct":
          temperature: 0.7
          top_k: 20
          top_p: 0.80
          min_p: 0.0
          presence_penalty: 1.5
          chat_template_kwargs:
            enable_thinking: false

  # --------------------------------------------------------------------------------
  kokoro-tts:
    name: "kokoro TTS"
    useModelName: "tts-1"
    cmd: podman compose up kokoro-tts
    cmdStop: podman compose stop kokoro-tts
    proxy: http://kokoro-tts:8880
    ttl: 0
    aliases: ["kokoro", "tts", "tts-1"]

  kokoro-tts-rocm:
    name: "kokoro TTS ROCm"
    useModelName: "tts-1"
    cmd: podman compose up kokoro-tts-rocm
    cmdStop: podman compose stop kokoro-tts-rocm
    proxy: http://kokoro-tts-rocm:8880
    ttl: 0
    aliases: ["kokoro-rocm", "tts-rocm", "tts-1-rocm"]

  # https://github.com/mostlygeek/llama-swap/issues/41#issuecomment-2722637867
  whisper:
    # needed
    checkEndpoint: /v1/audio/transcriptions/
    cmd: podman compose up whisper.cpp
    cmdStop: podman compose stop whisper.cpp
    proxy: http://whisper.cpp:8080
    #proxy: "http://host.containers.internal:8999"
    aliases: ["whisper.cpp", "stt"]
    ttl: 0


# selectors: virtual model IDs resolved to concrete targets per request
# - optional, default: empty dictionary
# - profiles run first, so a profile pin may target a selector
# - selector IDs cannot collide with model IDs, aliases, or peer model names
# - selector targets cannot be other selectors
# - selectors are not supported on /upstream/<model> paths
# selectors: route Claude Code dynamic model IDs to local Qwen3.6-35B-A3B-MTP
# Claude Code sends model IDs like claude-sonnet-4-1-20250514; these selectors
# catch them and resolve to the local model which applies its setParamsByID
# filters (reasoning_effort variants, etc.). No corresponding aliases needed in
# the models block — the selector does all the routing.
selectors:
  claude-sonnet-4-1:
    # pin always uses the first target; remaining entries are reference data
    strategy: pin
    targets:
      - qwen3.6-35B-A3B-MTP:precise
    name: Claude Sonnet 4 (Code)
  claude-sonnet-5:
    strategy: pin
    targets:
      - qwen3.6-35B-A3B-MTP:precise
    name: Claude Sonnet 4.5 (Code)
  "claude-opus-4-8[1m]":
    strategy: pin
    targets:
      - qwen3.6-35B-A3B-MTP:precise-preserve-thinking
    name: Claude Opus 4 (Code)
  claude-haiku-4-5-20251001:
    strategy: pin
    targets:
      - qwen3.6-35B-A3B-MTP:precise-instruct
    name: Claude Haiku 4.5 (Code)

