<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benchmark Viewer — llama-bench results</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #242836;
  --border: #2e3348;
  --text: #e2e4ed;
  --text-dim: #8b8fa3;
  --accent: #6c8cff;
  --accent-hover: #8ba4ff;
  --danger: #ff6b6b;
  --success: #51cf66;
  --radius: 6px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
}

.container { max-width: 1400px; margin: 0 auto; padding: 16px; }

/* Header */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 8px;
}
.header h1 { font-size: 18px; font-weight: 600; }
.header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* Buttons */
button {
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 6px 14px;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 13px;
  font-family: inherit;
  transition: background 0.15s;
}
button:hover { background: var(--border); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { background: var(--accent-hover); }
button.danger { color: var(--danger); border-color: var(--danger); }
button.danger:hover { background: var(--danger); color: #fff; }
button:disabled { opacity: 0.4; cursor: not-allowed; }

/* Status bar */
.status-bar {
  padding: 8px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 16px;
  font-size: 13px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.status-bar .status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--text-dim);
  flex-shrink: 0;
}
.status-bar .status-dot.ready { background: var(--success); }
.status-bar .status-dot.loading { background: #ffd43b; animation: pulse 1s infinite; }
.status-bar .status-dot.error { background: var(--danger); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

/* Filter panel */
.filter-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 16px;
}
.filter-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  cursor: pointer;
  user-select: none;
}
.filter-panel-header h2 { font-size: 14px; font-weight: 600; }
.filter-panel-body { padding: 0 14px 12px; }
.filter-panel-body.collapsed { display: none; }

.filter-row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: flex-end;
}
.filter-group {
  display: flex;
  flex-direction: column;
  gap: 3px;
  flex: 1;
  min-width: 140px;
}
.filter-group label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-dim);
  font-weight: 600;
}
/* ---- TGS Range Slider ---- */
.tgs-slider-row {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin-top: 4px;
}
.tgs-slider {
  display: none;
  padding: 4px 0;
}
.tgs-slider.visible {
  display: block;
}
.tgs-slider-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-dim);
  font-weight: 600;
  margin-bottom: 2px;
}
.tgs-slider-value {
  font-size: 10px;
  color: var(--text-dim);
  font-family: monospace;
  text-align: center;
  margin-top: 1px;
}
.range-slider {
  position: relative;
  height: 24px;
  cursor: pointer;
  user-select: none;
}
.range-slider-track {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  left: 0;
  right: 0;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
}
.range-slider-fill {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  height: 4px;
  background: var(--accent);
  border-radius: 2px;
  pointer-events: none;
}
.range-slider-handle {
  position: absolute;
  top: 50%;
  width: 14px;
  height: 14px;
  margin-left: -7px;
  margin-top: -7px;
  background: var(--accent);
  border: 2px solid var(--surface);
  border-radius: 50%;
  cursor: grab;
  transition: box-shadow 0.15s;
  z-index: 2;
}
.range-slider-handle:hover {
  box-shadow: 0 0 0 3px rgba(108,140,255,0.3);
}
.range-slider-handle.dragging {
  cursor: grabbing;
  box-shadow: 0 0 0 4px rgba(108,140,255,0.4);
}

.filter-group select, .filter-group input {
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 6px 10px;
  border-radius: var(--radius);
  font-size: 13px;
  font-family: inherit;
  width: 100%;
}
.filter-group select:focus, .filter-group input:focus {
  outline: none;
  border-color: var(--accent);
}

/* Chart controls */
.chart-controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.chart-controls-left { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chart-controls-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* Chart area */
.chart-container {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 16px;
  min-height: 400px;
  position: relative;
}
.chart-container .plotly-chart { width: 100%; }
.chart-placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 300px;
  color: var(--text-dim);
  font-size: 15px;
}

/* Data table */
.table-container {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 16px;
}
.table-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  cursor: pointer;
  user-select: none;
}
.table-header h2 { font-size: 14px; font-weight: 600; }
.table-body { overflow: auto; max-height: 500px; }
.table-body.collapsed { display: none; }

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
th {
  position: sticky;
  top: 0;
  background: var(--surface2);
  padding: 8px 12px;
  text-align: left;
  font-weight: 600;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-dim);
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}
th:hover { color: var(--text); }
td {
  padding: 6px 12px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
tr:hover td { background: var(--surface2); }

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
}
.modal-overlay.hidden { display: none; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  max-width: 700px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
  padding: 20px;
}
.modal h2 { font-size: 16px; margin-bottom: 12px; }
.modal pre {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  font-size: 12px;
  overflow-x: auto;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 400px;
  overflow-y: auto;
  margin-bottom: 12px;
}
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

/* Responsive */
@media (max-width: 768px) {
  .filter-group { min-width: 100%; }
  .chart-container { padding: 8px; }
}
</style>
</head>

<div class="container">
  <!-- Header -->
  <div class="header">
    <h1>Benchmark Viewer</h1>
    <div class="header-actions">
      <button id="btnSelectFolder" class="primary">Select Data Folder</button>

        <div class="filter-group">

 <!-- Data table -->

<script>
// ============================================================
// Benchmark Viewer — Main Application
// ============================================================

(function() {
  'use strict';

  // ---- State ----
  let allRuns = [];        // All loaded benchmark runs (flattened)
  let filteredRuns = [];   // Runs after filtering
  let dataMode = 'none';   // 'http' | 'picker' | 'none'
  let directoryHandle = null;
  let refreshTimer = null;

  // TGS range slider state
  let tgsPPRange = [0, Infinity];  // [min, max] for prompt processing
  let tgsTGRange = [0, Infinity];  // [min, max] for token generation
  let tgsPPMax = Infinity;
  let tgsTGMax = Infinity;
  let draggingHandle = null;
  let sortColumn = 'test_time';
  let sortAsc = false;

  // ---- Column definitions ----
  const COLUMNS = [
    { id: 'date',         label: 'Date',         key: '_sourceDate',        defaultVisible: true },
    { id: 'model',        label: 'Model',        key: 'model_type',         defaultVisible: true },
    { id: 'hf_owner',     label: 'HF Owner',     key: '_hfOwner',           defaultVisible: false },
    { id: 'hf_repo',      label: 'HF Repo',      key: '_hfRepo',            defaultVisible: false },
    { id: 'hf_revision',  label: 'HF Revision',  key: '_hfRevision',        defaultVisible: false },
    { id: 'backend',      label: 'Backend',      key: 'backends',           defaultVisible: true },
    { id: 'n_prompt',     label: 'Prompt',       key: 'n_prompt',           defaultVisible: true },
    { id: 'n_gen',        label: 'Gen',          key: 'n_gen',              defaultVisible: true },
    { id: 'avg_ts',       label: 'tgs',          key: 'avg_ts',             defaultVisible: true },
    { id: 'stddev_ts',    label: 'Stddev',       key: 'stddev_ts',          defaultVisible: true },
    { id: 'n_threads',    label: 'Threads',      key: 'n_threads',          defaultVisible: false },
    { id: 'n_gpu_layers', label: 'GPU Layers',   key: 'n_gpu_layers',       defaultVisible: false },
  ];

  // Filter dimensions
  const FILTERS = ['hf_owner', 'hf_repo', 'hf_revision', 'backend', 'model', 'quant', 'version', 'dateFrom', 'dateTo'];

  // Column visibility state (default visible columns)
  let columnVisibility = {};
  COLUMNS.forEach(col => { columnVisibility[col.id] = col.defaultVisible; });

  // ---- Persistence key ----
  const STORAGE_KEY = 'benchmark-viewer-settings';

  // ---- Settings helpers ----

  function loadSettings() {
    const keys = ['chartMode', 'chartType', 'chartXAxis', 'chartYAxis', 'filterBackend', 'filterModel',
                'filterQuant', 'filterVersion', 'filterDateFrom', 'filterDateTo', 'dataPath'];
    let settings = {};

    // 1. URL params (highest priority — shareable)
    const params = new URLSearchParams(window.location.search);
    for (const key of keys) {
      if (params.has(key)) {
        settings[key] = params.get(key);
      }
    }

    // 2. Hash (short, shareable, base64 encoded JSON)
    if (Object.keys(settings).length === 0) {
      const hash = window.location.hash.slice(1);
      if (hash) {
        try {
          settings = JSON.parse(atob(hash));
        } catch (e) { /* ignore */ }
      }
    }

    // 3. localStorage (convenience — not shareable)
    if (Object.keys(settings).length === 0) {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          settings = JSON.parse(atob(stored));
        }
      } catch (e) { /* ignore */ }
    }

    return settings;
  }

  function applySettings(settings) {
    for (const [key, val] of Object.entries(settings)) {
      const el = $(key);
      if (el) {
        if (el.tagName === 'SELECT' || el.tagName === 'INPUT') {
          el.value = val;
        }
      }
    }
    // Apply column visibility
    if (settings.columns) {
      for (const col of COLUMNS) {
        if (settings.columns[col.id] !== undefined) {
          columnVisibility[col.id] = settings.columns[col.id];
        }
      }
    }
  }

  function buildHash() {
    const settings = { columns: {} };
    const keys = ['chartMode', 'chartType', 'chartXAxis', 'chartYAxis', 'filterHfOwner', 'filterHfRepo', 'filterHfRevision',
                'filterBackend', 'filterModel', 'filterQuant', 'filterVersion', 'filterDateFrom', 'filterDateTo', 'dataPath'];
    for (const key of keys) {
      const el = $(key);
      if (el && el.value) {
        settings[key] = el.value;
      }
    }
    for (const col of COLUMNS) {
      if (columnVisibility[col.id]) {
        settings.columns[col.id] = true;
      }
    }
    return btoa(JSON.stringify(settings));
  }

  function saveSettings() {
    const hash = buildHash();
    try {
      localStorage.setItem(STORAGE_KEY, hash);
    } catch (e) {
      // ignore
    }
  }

  function shareSettings() {
    const hash = buildHash();
    if (hash) {
      window.location.hash = hash;
    } else {
      window.location.hash = '';
    }
    const url = window.location.href;
    copyText(url, $('btnShare'));
  }

  function copyText(text, btn) {
    // Try clipboard API first (requires secure context)
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => {
        if (btn) { btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Share', 2000); }
      }).catch(() => {
        // clipboard API failed — fallback below
        copyTextFallback(text, btn);
      });
    } else {
      copyTextFallback(text, btn);
    }
  }

  function copyTextFallback(text, btn) {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.left = '-9999px';
    document.body.appendChild(textarea);
    textarea.select();
    try {
      document.execCommand('copy');
      if (btn) { btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Share', 2000); }
    } catch (e) {
      showModal('Copy', text);
    }
    document.body.removeChild(textarea);
  }

  function showUrlFallback(url) {
    showModal('Share Link', url);
  }

  function clearSettings() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    window.location.hash = '';
    window.history.replaceState(null, '', window.location.pathname);
    // Reset all controls to defaults (dates stay — they come from the data)
    $('chartMode').value = 'gen';
    $('chartType').value = 'line';
    $('chartXAxis').value = 'n_prompt';
    $('chartYAxis').value = 'avg_ts';
    $('filterHfOwner').value = '';
    $('filterHfRepo').value = '';
    $('filterHfRevision').value = '';
    $('filterBackend').value = '';
    $('filterModel').value = '';
    $('filterQuant').value = '';
    $('filterVersion').value = '';
    $('dataPath').value = '/data/';
    $('autoRefreshInterval').value = '10000';
    // Repopulate date range from data
    populateDateRange();
    applyFilters();
  }

  // ---- DOM refs ----
  const $ = id => document.getElementById(id);

  // ---- Data loading ----

  async function loadFromServer() {
    setStatus('loading', 'Loading from server...');
    try {
      // Resolve data path relative to the current page URL
      let dataPath = $('dataPath').value.replace(/\/$/, '');
      const baseUrl = window.location.origin + window.location.pathname;
      const resolved = new URL(dataPath + '/', baseUrl);
      const dataUrl = resolved.href;

      const resp = await fetch(dataUrl);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const html = await resp.text();

      // Parse <a href="..."> links
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      const links = doc.querySelectorAll('a[href]');

      const dirs = [];
      const jsonFiles = [];

      for (const a of links) {
        const href = a.getAttribute('href');
        if (!href) continue;

        // Resolve href relative to the data URL
        let absUrl;
        try {
          absUrl = new URL(href, dataUrl).href;
        } catch {
          continue;
        }

        // Handle nested directories
        if (absUrl.endsWith('/')) {
          dirs.push(absUrl);
        } else if (absUrl.endsWith('.json')) {
          jsonFiles.push(absUrl);
        }
      }

      // Also fetch subdirectories
      for (const dirUrl of dirs) {
        try {
          const subResp = await fetch(dirUrl);
          if (!subResp.ok) continue;
          const subHtml = await subResp.text();
          const subDoc = parser.parseFromString(subHtml, 'text/html');
          for (const a of subDoc.querySelectorAll('a[href]')) {
            const href = a.getAttribute('href');
            if (!href) continue;
            try {
              const jsonUrl = new URL(href, dirUrl).href;
              if (jsonUrl.endsWith('.json')) {
                jsonFiles.push(jsonUrl);
              }
            } catch {
              // skip
            }
          }
        } catch (e) {
          // skip
        }
      }

      if (jsonFiles.length === 0) {
        setStatus('error', 'No JSON files found in ' + dataPath);
        return;
      }

      // Fetch all JSON files
      setStatus('loading', `Loading ${jsonFiles.length} files...`);
      const results = [];
      for (const url of jsonFiles) {
        try {
          const r = await fetch(url);
          if (!r.ok) continue;
          const data = await r.json();
          if (Array.isArray(data)) {
            // Extract date from URL path
            const dateMatch = url.match(/(\d{4}-\d{2}-\d{2})/);
            const dateStr = dateMatch ? dateMatch[1] : '';
            for (const run of data) {
              run._sourceDate = dateStr;
              run._sourceFile = url;
              enrichRun(run);
              results.push(run);
            }
          }
        } catch (e) {
          // skip bad files
        }
      }

      allRuns = results;
      filteredRuns = results.slice();
      dataMode = 'http';
      setStatus('ready', `Loaded ${allRuns.length} runs from ${jsonFiles.length} files`);
      populateFilters();
      applyFilters();
    } catch (e) {
      setStatus('error', `Failed to load from server: ${e.message}`);
    }
  }

  async function selectFolder() {
    if (!window.showDirectoryPicker) {
      setStatus('error', 'File System Access API not supported. Use a modern browser (Chrome/Edge).');
      return;
    }

    try {
      const handle = await window.showDirectoryPicker();
      directoryHandle = handle;
      setStatus('loading', 'Reading files...');

      const results = [];
      let fileCount = 0;

      for await (const entry of handle.values()) {
        if (entry.kind === 'directory') {
          // Scan subdirectories for JSON files
          for await (const subEntry of entry.values()) {
            if (subEntry.kind === 'file' && subEntry.name.endsWith('.json')) {
              fileCount++;
              try {
                const file = await subEntry.getFile();
                const text = await file.text();
                const data = JSON.parse(text);
                if (Array.isArray(data)) {
                  const dateStr = entry.name;
                  for (const run of data) {
                    run._sourceDate = dateStr;
                    run._sourceFile = `${entry.name}/${subEntry.name}`;
                    enrichRun(run);
                    results.push(run);
                  }
                }
              } catch (e) {
                // skip parse errors
              }
            }
          }
        }
      }

      if (results.length === 0) {
        setStatus('error', 'No JSON files found in selected folder');
        return;
      }

      allRuns = results;
      filteredRuns = results.slice();
      dataMode = 'picker';
      setStatus('ready', `Loaded ${allRuns.length} runs from ${fileCount} files`);
      populateFilters();
      applyFilters();
    } catch (e) {
      if (e.name !== 'AbortError') {
        setStatus('error', `Failed to read folder: ${e.message}`);
      }
    }
  }

  async function refreshData() {
    if (dataMode === 'picker' && directoryHandle) {
      const results = [];
      let fileCount = 0;

      for await (const entry of directoryHandle.values()) {
        if (entry.kind === 'directory') {
          for await (const subEntry of entry.values()) {
            if (subEntry.kind === 'file' && subEntry.name.endsWith('.json')) {
              fileCount++;
              try {
                const file = await subEntry.getFile();
                const text = await file.text();
                const data = JSON.parse(text);
                if (Array.isArray(data)) {
                  for (const run of data) {
                    run._sourceDate = entry.name;
                    run._sourceFile = `${entry.name}/${subEntry.name}`;
                    enrichRun(run);
                    results.push(run);
                  }
                }
              } catch (e) {}
            }
          }
        }
      }

      if (results.length !== allRuns.length) {
        allRuns = results;
        filteredRuns = results.slice();
        populateFilters();
        applyFilters();
      }
    } else if (dataMode === 'http') {
      await loadFromServer();
    }
  }

  // ---- Filtering ----

  function parseModelInfo(run) {
    // Try to extract model family, size, quant from model_type
    const mt = run.model_type || '';
    // Pattern: "qwen35moe 35B.A3B Q8_0" or "gpt-oss 120B BF16" or "qwen3 4B Q6_K"
    const parts = mt.split(/\s+/);
    let family = parts[0] || '';
    let size = '';
    let quant = '';

    // Find quant (usually last part, e.g. Q8_0, Q6_K, BF16)
    for (let i = parts.length - 1; i >= 1; i--) {
      if (parts[i].match(/^[QqBb]/)) {
        quant = parts[i];
        size = parts.slice(1, i).join(' ');
        break;
      }
    }
    if (!size) {
      size = parts.slice(1).join(' ');
    }

    return { family, size, quant };
  }

  function enrichRun(run) {
    // Parse model_filename into structured fields
    const fn = parseModelFilename(run.model_filename);
    run._hfOwner = fn.owner;
    run._hfRepo = fn.repo;
    run._hfModelName = fn.model_name;
    run._hfRevision = fn.revision;
    return run;
  }

  function parseModelFilename(filename) {
    // Example: "/huggingface/hub/models--unsloth--Qwen3.6-35B-A3B-GGUF/snapshots/a483e9e6cbd595906af30beda3187c2663a1118c/Qwen3.6-35B-A3B-UD-Q8_K_XL.gguf"
    if (!filename) return { owner: '', repo: '', model_name: '', revision: '' };

    const parts = filename.split('/');
    let model_name = '';
    let revision = '';

    // Find the filename (last non-empty part)
    for (let i = parts.length - 1; i >= 0; i--) {
      if (parts[i].endsWith('.gguf')) {
        model_name = parts[i].replace(/\.gguf$/, '');
        break;
      }
    }

    // Find the snapshot hash (directory containing .gguf files)
    for (let i = parts.length - 2; i >= 0; i--) {
      if (parts[i] === 'snapshots') {
        // Next part is the revision hash
        revision = (parts[i + 1] || '').substring(0, 7);
        break;
      }
    }

    // Find models--X--Y pattern
    let owner = '';
    let repo = '';
    for (const part of parts) {
      const m = part.match(/^models--(.+?)--(.+)$/);
      if (m) {
        owner = m[1];
        repo = m[2];
        break;
      }
    }

    return { owner, repo, model_name, revision };
  }

  function parseVersion(run) {
    // Parse version from filename or backends field
    // e.g. "rocm-6.4.4", "rocm-7.2", "rocm7-nightlies", "vulkan-amdvlk", "vulkan-radv"
    const file = run._sourceFile || '';
    const backend = run.backends || '';

    // Try to extract version-like patterns
    const versionPatterns = [
      /rocm[/-]([\d.]+)/,
      /rocm[/-](nightlies)/,
      /vulkan-([a-z]+)/,
      /rocm7/,
    ];

    for (const pat of versionPatterns) {
      const m = file.match(pat);
      if (m) return m[1] || m[0];
    }

    // Fallback: use backends as version
    if (backend && !backend.includes('ROCm') && !backend.includes('Vulkan')) {
      return backend;
    }

    return backend;
  }

  function getRunsMatchingFilters(except, exceptValue) {
    // Get candidates for repopulating dropdowns.
    // Discrete filters (backend, model, quant, version, hf) are respected.
    // Date range is NOT used for candidate computation — it's a range, not a discrete choice,
    // and using it would block valid options when the user hasn't explicitly narrowed dates yet.
    // exceptValue is the new value from the event target (browser may not have updated DOM yet)
    const vals = {
      hfOwner: except === 'filterHfOwner' ? exceptValue || '' : $('filterHfOwner').value,
      hfRepo: except === 'filterHfRepo' ? exceptValue || '' : $('filterHfRepo').value,
      hfRevision: except === 'filterHfRevision' ? exceptValue || '' : $('filterHfRevision').value,
      backend: except === 'filterBackend' ? exceptValue || '' : $('filterBackend').value,
      model: except === 'filterModel' ? exceptValue || '' : $('filterModel').value,
      quant: except === 'filterQuant' ? exceptValue || '' : $('filterQuant').value,
      version: except === 'filterVersion' ? exceptValue || '' : $('filterVersion').value,
    };

     return allRuns.filter(run => {
      if (vals.hfOwner && run._hfOwner !== vals.hfOwner) return false;
      if (vals.hfRepo && run._hfRepo !== vals.hfRepo) return false;
      if (vals.hfRevision && run._hfRevision !== vals.hfRevision) return false;
      if (vals.backend && run.backends !== vals.backend) return false;
      if (vals.model) {
        const info = parseModelInfo(run);
        if (info.family !== vals.model) return false;
      }
      if (vals.quant) {
        const info = parseModelInfo(run);
        if (info.quant !== vals.quant) return false;
      }
      if (vals.version && parseVersion(run) !== vals.version) return false;
      // TGS range filter (for cross-filtering candidates)
      const tgs = run.avg_ts || 0;
      const isPP = (run.n_prompt || 0) > 0 && (run.n_gen || 0) === 0;
      const isTG = (run.n_prompt || 0) === 0 && (run.n_gen || 0) > 0;
      if (isPP && (tgs < tgsPPRange[0] || tgs > tgsPPRange[1])) return false;
      if (isTG && (tgs < tgsTGRange[0] || tgs > tgsTGRange[1])) return false;
      return true;
    });
  }

  function populateAllFromRuns(candidates) {
    const hfOwners = new Set();
    const hfRepos = new Set();
    const hfRevisions = new Set();
    const backends = new Set();
    const families = new Set();
    const quants = new Set();
    const versions = new Set();

    for (const run of candidates) {
      if (run._hfOwner) hfOwners.add(run._hfOwner);
      if (run._hfRepo) hfRepos.add(run._hfRepo);
      if (run._hfRevision) hfRevisions.add(run._hfRevision);
      backends.add(run.backends || '');
      const info = parseModelInfo(run);
      families.add(info.family);
      if (info.quant) quants.add(info.quant);
      versions.add(parseVersion(run));
    }

    // Populate all dropdowns from candidates
    ['filterHfOwner', 'filterHfRepo', 'filterHfRevision', 'filterBackend',
     'filterModel', 'filterQuant', 'filterVersion'].forEach(id => {
      const vals = id === 'filterHfOwner' ? hfOwners :
        id === 'filterHfRepo' ? hfRepos :
        id === 'filterHfRevision' ? hfRevisions :
        id === 'filterBackend' ? backends :
        id === 'filterModel' ? families :
        id === 'filterQuant' ? quants : versions;
      const sel = $(id);
      const current = sel.value;
      populateSelect(id, vals);
      // Restore current selection if still available
      if ([...sel.options].some(o => o.value === current)) {
        sel.value = current;
      } else {
        sel.value = '';
      }
    });
    updateTgsSliders();
  }

  function populateFilters() {
    const hfOwners = new Set();
    const hfRepos = new Set();
    const hfRevisions = new Set();
    const backends = new Set();
    const families = new Set();
    const quants = new Set();
    const versions = new Set();

    for (const run of allRuns) {
      if (run._hfOwner) hfOwners.add(run._hfOwner);
      if (run._hfRepo) hfRepos.add(run._hfRepo);
      if (run._hfRevision) hfRevisions.add(run._hfRevision);
      backends.add(run.backends || '');
      const info = parseModelInfo(run);
      families.add(info.family);
      if (info.quant) quants.add(info.quant);
      versions.add(parseVersion(run));
    }

    populateSelect('filterHfOwner', hfOwners);
    populateSelect('filterHfRepo', hfRepos);
    populateSelect('filterHfRevision', hfRevisions);
    populateSelect('filterBackend', backends);
    populateSelect('filterModel', families);
    populateSelect('filterQuant', quants);
    populateSelect('filterVersion', versions);

    populateDateRange();
    updateTgsSliders();
  }

  function populateDateRange() {
    const dates = allRuns.map(r => r._sourceDate).filter(Boolean);
    if (dates.length > 0) {
      dates.sort();
      setFilterDate('filterDateFrom', dates[0]);
      setFilterDate('filterDateTo', dates[dates.length - 1]);
    }
  }

  function setFilterDate(inputId, dateStr) {
    const input = $(inputId);
    const display = $(inputId + 'Display');
    if (dateStr) {
      input.value = dateStr;
      display.value = formatDate(dateStr);
    } else {
      input.value = '';
      display.value = '';
    }
  }

  function formatDate(dateStr) {
    // Convert "2026-01-15" to "15-Jan-2026"
    if (!dateStr) return '';
    const [year, month, day] = dateStr.split('-');
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${day}-${months[parseInt(month, 10) - 1]}-${year}`;
  }

  function populateSelect(id, values) {
    const sel = $(id);
    const current = sel.value;
    sel.innerHTML = '<option value="">All</option>';
    for (const v of [...values].sort()) {
      const opt = document.createElement('option');
      opt.value = v;
      opt.textContent = v;
      sel.appendChild(opt);
    }
    sel.value = current;
  }

  // ---- TGS Range Slider ----

  function buildRangeSlider(containerId, minVal, maxVal) {
    const container = $(containerId);
    if (!container) return;
    if (container._built) return; // already built
    container._built = true;

    const fill = container.querySelector('.range-slider-fill');
    const handles = container.querySelectorAll('.range-slider-handle');
    const valueDisplay = container.closest('.tgs-slider').querySelector('.tgs-slider-value');

    const min = Math.max(minVal, 0);

    function posToPct(pos) {
      return Math.max(0, Math.min(1, pos / container.offsetWidth));
    }

    function updateVisuals(pcts) {
      const [lp, rp] = pcts;
      fill.style.left = (lp * 100) + '%';
      fill.style.width = ((rp - lp) * 100) + '%';
      handles[0].style.left = (lp * 100) + '%';
      handles[1].style.left = (rp * 100) + '%';

      const range = maxVal - min || 1;
      const lo = min + lp * range;
      const hi = min + rp * range;
      valueDisplay.textContent = (lo < 1 ? lo.toFixed(1) : Math.round(lo)) + ' – ' + (hi >= maxVal ? '∞' : (hi < 1 ? hi.toFixed(1) : Math.round(hi))) + ' tgs';
    }

    // Drag logic
    let dragging = null;

    function onDown(e) {
      if (e.target.classList.contains('range-slider-handle')) {
        dragging = e.target.dataset.handle;
        e.target.classList.add('dragging');
        e.preventDefault();
      }
    }

    function onMove(e) {
      if (!dragging) return;
      const rect = container.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      let pct = posToPct(clientX - rect.left);

      if (dragging === 'min') {
        container._pct[0] = Math.min(pct, container._pct[1] - 0.005);
      } else {
        container._pct[1] = Math.max(pct, container._pct[0] + 0.005);
      }
      updateVisuals(container._pct);
    }

    function onUp() {
      if (dragging) {
        const handle = container.querySelector('.range-slider-handle[data-handle="' + dragging + '"]');
        if (handle) handle.classList.remove('dragging');
        dragging = null;
        onSliderChange();
      }
    }

    container.addEventListener('mousedown', onDown);
    container.addEventListener('touchstart', onDown, { passive: false });
    window.addEventListener('mousemove', onMove);
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('mouseup', onUp);
    window.addEventListener('touchend', onUp);

    container._pct = [0, 1];
    updateVisuals([0, 1]);
  }

  function onSliderChange() {
    const pp = $('rangeSliderPP');
    const tg = $('rangeSliderTG');
    if (pp && pp._pct) {
      tgsPPRange = [pp._pct[0] * tgsPPMax, pp._pct[1] * tgsPPMax];
    }
    if (tg && tg._pct) {
      tgsTGRange = [tg._pct[0] * tgsTGMax, tg._pct[1] * tgsTGMax];
    }
    applyFilters();
    saveSettings();
  }

  function updateTgsSliders() {
    const ppRuns = filteredRuns.filter(r => (r.n_prompt || 0) > 0 && (r.n_gen || 0) === 0);
    const tgRuns = filteredRuns.filter(r => (r.n_prompt || 0) === 0 && (r.n_gen || 0) > 0);

    const ppTs = ppRuns.map(r => r.avg_ts || 0);
    const tgTs = tgRuns.map(r => r.avg_ts || 0);

    const prevPPMax = tgsPPMax;
    const prevTGMax = tgsTGMax;

    tgsPPMax = ppTs.length > 0 ? Math.max(...ppTs) : 100;
    tgsTGMax = tgTs.length > 0 ? Math.max(...tgTs) : 100;

    // Clamp ranges to new max
    if (tgsPPRange[0] > tgsPPMax) tgsPPRange[0] = tgsPPMax;
    if (tgsPPRange[1] > tgsPPMax) tgsPPRange[1] = tgsPPMax;
    if (tgsTGRange[0] > tgsTGMax) tgsTGRange[0] = tgsTGMax;
    if (tgsTGRange[1] > tgsTGMax) tgsTGRange[1] = tgsTGMax;

    // Show/hide sliders
    $('tgsSliderPP').classList.toggle('visible', ppRuns.length > 0);
    $('tgsSliderTG').classList.toggle('visible', tgRuns.length > 0);

    // Build sliders once, update positions thereafter
    if (ppRuns.length > 0) {
      if (!$('rangeSliderPP')._built) {
        buildRangeSlider('rangeSliderPP', 0);
      }
      const range = tgsPPMax || 1;
      const pcts = [tgsPPRange[0] / range, tgsPPRange[1] / range];
      $('rangeSliderPP')._pct = pcts;
      const fill = $('rangeSliderPP').querySelector('.range-slider-fill');
      const handles = $('rangeSliderPP').querySelectorAll('.range-slider-handle');
      fill.style.left = (pcts[0] * 100) + '%';
      fill.style.width = ((pcts[1] - pcts[0]) * 100) + '%';
      handles[0].style.left = (pcts[0] * 100) + '%';
      handles[1].style.left = (pcts[1] * 100) + '%';
      const valueDisplay = $('tgsSliderPP').querySelector('.tgs-slider-value');
      valueDisplay.textContent = (pcts[0] * tgsPPMax < 1 ? (pcts[0] * tgsPPMax).toFixed(1) : Math.round(pcts[0] * tgsPPMax)) + ' – ' + (pcts[1] * tgsPPMax < 1 ? (pcts[1] * tgsPPMax).toFixed(1) : Math.round(pcts[1] * tgsPPMax)) + ' tgs';
    }

    if (tgRuns.length > 0) {
      if (!$('rangeSliderTG')._built) {
        buildRangeSlider('rangeSliderTG', 0);
      }
      const range = tgsTGMax || 1;
      const pcts = [tgsTGRange[0] / range, tgsTGRange[1] / range];
      $('rangeSliderTG')._pct = pcts;
      const fill = $('rangeSliderTG').querySelector('.range-slider-fill');
      const handles = $('rangeSliderTG').querySelectorAll('.range-slider-handle');
      fill.style.left = (pcts[0] * 100) + '%';
      fill.style.width = ((pcts[1] - pcts[0]) * 100) + '%';
      handles[0].style.left = (pcts[0] * 100) + '%';
      handles[1].style.left = (pcts[1] * 100) + '%';
      const valueDisplay = $('tgsSliderTG').querySelector('.tgs-slider-value');
      valueDisplay.textContent = (pcts[0] * tgsTGMax < 1 ? (pcts[0] * tgsTGMax).toFixed(1) : Math.round(pcts[0] * tgsTGMax)) + ' – ' + (pcts[1] * tgsTGMax < 1 ? (pcts[1] * tgsTGMax).toFixed(1) : Math.round(pcts[1] * tgsTGMax)) + ' tgs';
    }
  }

  function applyFilters() {
    const hfOwner = $('filterHfOwner').value;
    const hfRepo = $('filterHfRepo').value;
    const hfRevision = $('filterHfRevision').value;
    const backend = $('filterBackend').value;
    const model = $('filterModel').value;
    const quant = $('filterQuant').value;
    const version = $('filterVersion').value;
    const dateFrom = $('filterDateFrom').value;
    const dateTo = $('filterDateTo').value;

    filteredRuns = allRuns.filter(run => {
      if (hfOwner && run._hfOwner !== hfOwner) return false;
      if (hfRepo && run._hfRepo !== hfRepo) return false;
      if (hfRevision && run._hfRevision !== hfRevision) return false;
      if (backend && run.backends !== backend) return false;
      if (model) {
        const info = parseModelInfo(run);
        if (info.family !== model) return false;
      }
      if (quant) {
        const info = parseModelInfo(run);
        if (info.quant !== quant) return false;
      }
      if (version && parseVersion(run) !== version) return false;
      if (dateFrom && run._sourceDate < dateFrom) return false;
      if (dateTo && run._sourceDate > dateTo) return false;
      // TGS range filter
      const tgs = run.avg_ts || 0;
      const isPP = (run.n_prompt || 0) > 0 && (run.n_gen || 0) === 0;
      const isTG = (run.n_prompt || 0) === 0 && (run.n_gen || 0) > 0;
      if (isPP && (tgs < tgsPPRange[0] || tgs > tgsPPRange[1])) return false;
      if (isTG && (tgs < tgsTGRange[0] || tgs > tgsTGRange[1])) return false;
      return true;
    });

    updateTable();
    renderChart();
    updateTgsSliders();
  }

  // ---- Chart rendering ----

  function getGroupKey(run) {
    // Create a unique identifier for grouping runs
    const info = parseModelInfo(run);
    const version = parseVersion(run);
    return `${info.family} ${info.size} ${info.quant} (${run.backends} ${version})`.trim();
  }

  function renderChart() {
    const container = $('chartContainer');
    const placeholder = $('chartPlaceholder');

    if (filteredRuns.length === 0) {
      container.innerHTML = '<div class="chart-placeholder">No data matches current filters</div>';
      return;
    }

    // Apply mode filter
    const mode = $('chartMode').value;
    const chartRuns = filteredRuns.filter(run => {
      if (mode === 'prompt') return (run.n_prompt || 0) > 0 && (run.n_gen || 0) === 0;
      if (mode === 'gen') return (run.n_prompt || 0) === 0 && (run.n_gen || 0) > 0;
      return true; // 'all'
    });

    if (chartRuns.length === 0) {
      container.innerHTML = '<div class="chart-placeholder">No ' + (mode === 'prompt' ? 'prompt processing' : 'token generation') + ' data matches current filters</div>';
      return;
    }

    const chartType = $('chartType').value;

    // Clear previous chart
    if (typeof Plotly !== 'undefined') {
      Plotly.purge(container);
    }

    if (chartType === 'radar') {
      renderRadarChart(container, chartRuns);
    } else if (chartType === 'box') {
      renderBoxChart(container, chartRuns);
    } else {
      renderGroupedChart(container, chartRuns);
    }
  }

  function renderGroupedChart(container, chartRuns) {
    const xAxis = $('chartXAxis').value;
    const yAxis = $('chartYAxis').value;
    const chartType = $('chartType').value;

    // Group runs by unique config (model + backend + version)
    const groups = {};
    for (const run of chartRuns) {
      const key = getGroupKey(run);
      if (!groups[key]) groups[key] = [];
      groups[key].push(run);
    }

    const groupNames = Object.keys(groups);
    const colors = [
      '#6c8cff', '#51cf66', '#ffd43b', '#ff6b6b', '#cc5de8',
      '#20c997', '#ff922b', '#339af0', '#f06595', '#a9e34b'
    ];

    const traces = groupNames.map((name, i) => {
      const runs = groups[name];

      if (xAxis === 'model_size') {
        // Scatter plot
        return {
          type: 'scatter',
          mode: 'markers',
          name: name,
          x: runs.map(r => r.model_size / 1e9), // GB
          y: runs.map(r => r[yAxis] || 0),
          text: runs.map(r =>
            `${r.model_type}<br>prompt=${r.n_prompt} gen=${r.n_gen}<br>tgs=${r.avg_ts.toFixed(1)} ±${r.stddev_ts.toFixed(1)}`
          ),
          marker: { size: 8, color: colors[i % colors.length] },
          hovertemplate: '%{text}<extra></extra>'
        };
      }

      // Line or bar: group by x-axis value
      const xValues = [...new Set(runs.map(r => r[xAxis] || 0))].sort((a, b) => a - b);

      if (chartType === 'bar') {
        // Grouped bar: one trace per x-value within this group
        const xLabels = xValues.map(v => v === 0 ? 'gen' : `${v}`);
        return {
          type: 'bar',
          name: name,
          x: xLabels,
          y: xValues.map(xv => {
            const match = runs.filter(r => (r[xAxis] || 0) === xv);
            return match.length > 0 ? match[0][yAxis] : 0;
          }),
          text: runs.map(r =>
            `${r.model_type}<br>x=${r[xAxis]} y=${(r[yAxis] || 0).toFixed(1)}<br>prompt=${r.n_prompt} gen=${r.n_gen}`
          ),
          hovertemplate: '%{text}<extra>%{name}</extra>'
        };
      }

      // Line chart
      return {
        type: 'scatter',
        mode: 'lines+markers',
        name: name,
        x: xValues,
        y: xValues.map(xv => {
          const match = runs.filter(r => (r[xAxis] || 0) === xv);
          return match.length > 0 ? match[0][yAxis] : null;
        }),
        text: runs.map(r =>
          `${r.model_type}<br>x=${r[xAxis]} y=${(r[yAxis] || 0).toFixed(1)}<br>prompt=${r.n_prompt} gen=${r.n_gen}`
        ),
        line: { color: colors[i % colors.length], width: 2 },
        marker: { size: 6, color: colors[i % colors.length] },
        hovertemplate: '%{text}<extra>%{name}</extra>'
      };
    });

    const layout = {
      paper_bgcolor: 'rgba(0,0,0,0)',
      plot_bgcolor: 'rgba(0,0,0,0)',
      font: { color: '#e2e4ed', family: '-apple-system, BlinkMacSystemFont, monospace' },
      margin: { l: 60, r: 20, t: 30, b: 60 },
      xaxis: {
        title: xAxis === 'model_size' ? 'Model Size (GB)' :
               xAxis === 'n_prompt' ? 'Prompt Length' : 'Gen Length',
        tickangle: xAxis === 'model_size' ? 0 : -30,
        gridcolor: '#2e3348',
        zerolinecolor: '#2e3348'
      },
      yaxis: {
        title: yAxis === 'avg_ts' ? 'Tokens/sec' :
               yAxis === 'avg_ns' ? 'Ns/token' : 'Stddev (tokens/sec)',
        gridcolor: '#2e3348',
        zerolinecolor: '#2e3348'
      },
      legend: {
        bgcolor: 'rgba(0,0,0,0)',
        bordercolor: '#2e3348',
        font: { size: 11 }
      },
      hoverlabel: {
        bgcolor: '#1a1d27',
        bordercolor: '#2e3348',
        font: { color: '#e2e4ed', size: 12 }
      }
    };

    if (chartType === 'bar') {
      layout.barmode = 'group';
    }

    container.innerHTML = '<div class="plotly-chart" id="plotDiv"></div>';
    Plotly.newPlot('plotDiv', traces, layout, {
      responsive: true,
      displayModeBar: false
    });
    setResponsiveLegend();
  }

  function renderRadarChart(container, chartRuns) {
    const yAxis = $('chartYAxis').value;

    // Group by config, aggregate metrics for radar
    const groups = {};
    for (const run of chartRuns) {
      const key = getGroupKey(run);
      if (!groups[key]) groups[key] = [];
      groups[key].push(run);
    }

    const groupNames = Object.keys(groups);
    if (groupNames.length === 0) return;

    // For radar: use prompt lengths as categories, y-axis values as metrics
    // If multiple runs per config, average them
    const categories = [...new Set(chartRuns.map(r => r.n_prompt || 0))].sort((a, b) => a - b);
    const colors = [
      '#6c8cff', '#51cf66', '#ffd43b', '#ff6b6b', '#cc5de8',
      '#20c997', '#ff922b', '#339af0', '#f06595', '#a9e34b'
    ];

    const traces = groupNames.map((name, i) => {
      const runs = groups[name];
      const values = categories.map(cat => {
        const match = runs.filter(r => (r.n_prompt || 0) === cat);
        return match.length > 0 ? match[0][yAxis] : 0;
      });

      return {
        type: 'scatterpolar',
        r: values,
        theta: categories.map(c => c === 0 ? 'gen' : `${c}`),
        name: name,
        fill: 'toself',
        fillColor: colors[i % colors.length] + '33',
        line: { color: colors[i % colors.length] },
        hovertemplate: `${name}<br>prompt=%{theta}: %{r:.1f}<extra></extra>`
      };
    });

    const layout = {
      paper_bgcolor: 'rgba(0,0,0,0)',
      plot_bgcolor: 'rgba(0,0,0,0)',
      font: { color: '#e2e4ed', family: 'monospace' },
      margin: { l: 40, r: 40, t: 30, b: 40 },
      polar: {
        angularaxis: {
          tickcolor: '#2e3348',
          tickfont: { size: 11 }
        },
        radialaxis: {
          tickcolor: '#2e3348',
          tickfont: { size: 11 },
          gridcolor: '#2e3348'
        }
      },
      legend: {
        bgcolor: 'rgba(0,0,0,0)',
        bordercolor: '#2e3348',
        font: { size: 11 }
      },
      hoverlabel: {
        bgcolor: '#1a1d27',
        bordercolor: '#2e3348',
        font: { color: '#e2e4ed', size: 12 }
      }
    };

    container.innerHTML = '<div class="plotly-chart" id="plotDiv"></div>';
    Plotly.newPlot('plotDiv', traces, layout, {
      responsive: true,
      displayModeBar: false
    });
    setResponsiveLegend();
  }

  function renderBoxChart(container, chartRuns) {
    const yAxis = $('chartYAxis').value;

    // Group by config, show distribution of y-axis values
    const groups = {};
    for (const run of chartRuns) {
      const key = getGroupKey(run);
      if (!groups[key]) groups[key] = [];
      groups[key].push(run);
    }

    const groupNames = Object.keys(groups).sort();
    if (groupNames.length === 0) return;

    const colors = [
      '#6c8cff', '#51cf66', '#ffd43b', '#ff6b6b', '#cc5de8',
      '#20c997', '#ff922b', '#339af0', '#f06595', '#a9e34b'
    ];

    const traces = groupNames.map((name, i) => {
      const runs = groups[name];
      return {
        type: 'box',
        y: runs.map(r => r[yAxis] || 0),
        name: name,
        boxmean: true,
        marker: { color: colors[i % colors.length] },
        line: { color: colors[i % colors.length] },
        hoverinfo: 'y+name'
      };
    });

    const layout = {
      paper_bgcolor: 'rgba(0,0,0,0)',
      plot_bgcolor: 'rgba(0,0,0,0)',
      font: { color: '#e2e4ed', family: 'monospace' },
      margin: { l: 60, r: 20, t: 30, b: 80 },
      yaxis: {
        title: yAxis === 'avg_ts' ? 'Tokens/sec' :
               yAxis === 'avg_ns' ? 'Ns/token' : 'Stddev (tokens/sec)',
        gridcolor: '#2e3348',
        zerolinecolor: '#2e3348'
      },
      xaxis: {
        tickangle: -45,
        gridcolor: '#2e3348'
      },
      boxmode: 'group',
      legend: {
        bgcolor: 'rgba(0,0,0,0)',
        bordercolor: '#2e3348',
        font: { size: 11 }
      },
      hoverlabel: {
        bgcolor: '#1a1d27',
        bordercolor: '#2e3348',
        font: { color: '#e2e4ed', size: 12 }
      }
    };

    container.innerHTML = '<div class="plotly-chart" id="plotDiv"></div>';
    Plotly.newPlot('plotDiv', traces, layout, {
      responsive: true,
      displayModeBar: false
    });
    setResponsiveLegend();
  }

  function setResponsiveLegend() {
    const plotDiv = document.getElementById('plotDiv');
    if (!plotDiv || !plotDiv.data) return;
    const narrow = window.innerWidth < 768;
    Plotly.relayout(plotDiv.id, {
      legend: {
        orientation: narrow ? 'h' : 'v',
        x: narrow ? 0.5 : 1.02,
        xanchor: narrow ? 'center' : 'left',
        y: narrow ? 1.12 : 1,
        yanchor: 'bottom'
      },
      margin: {
        l: 50, r: narrow ? 20 : 120,
        t: narrow ? 60 : 30,
        b: 50
      }
    });
  }

  window.addEventListener('resize', setResponsiveLegend);

  // ---- Table ----

  function updateTable() {
    // Rebuild table header based on visible columns
    const thead = $('dataTable').querySelector('thead tr');
    thead.innerHTML = '';
    for (const col of COLUMNS) {
      if (!columnVisibility[col.id]) continue;
      const th = document.createElement('th');
      th.dataset.sort = col.id;
      th.textContent = col.label;
      if (sortColumn === col.id) {
        th.textContent += sortAsc ? ' ↑' : ' ↓';
      }
      th.addEventListener('click', () => {
        sortColumn = col.id;
        sortAsc = !sortAsc;
        updateTable();
      });
      thead.appendChild(th);
    }

    const tbody = $('dataTableBody');
    tbody.innerHTML = '';

    // Apply mode filter for table too
    const mode = $('chartMode').value;
    const tableRuns = filteredRuns.filter(run => {
      if (mode === 'prompt') return (run.n_prompt || 0) > 0 && (run.n_gen || 0) === 0;
      if (mode === 'gen') return (run.n_prompt || 0) === 0 && (run.n_gen || 0) > 0;
      return true;
    });

    // Sort
    const sorted = [...tableRuns].sort((a, b) => {
      let va, vb;
      const col = COLUMNS.find(c => c.id === sortColumn);
      if (col) {
        va = col.key === 'model' ? `${parseModelInfo(a).family} ${parseModelInfo(a).size}` : (a[col.key] ?? '');
        vb = col.key === 'model' ? `${parseModelInfo(b).family} ${parseModelInfo(b).size}` : (b[col.key] ?? '');
      } else {
        va = a[sortColumn] ?? '';
        vb = b[sortColumn] ?? '';
      }
      if (typeof va === 'string') {
        return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
      }
      return sortAsc ? va - vb : vb - va;
    });

    for (const run of sorted) {
      const tr = document.createElement('tr');
      for (const col of COLUMNS) {
        if (!columnVisibility[col.id]) continue;
        const td = document.createElement('td');
        switch (col.id) {
          case 'model':
            const info = parseModelInfo(run);
            td.textContent = `${info.family} ${info.size}`;
            td.title = run.model_type || '';
            break;
          case 'hf_owner':
            td.textContent = run._hfOwner || '';
            break;
          case 'hf_repo':
            td.textContent = run._hfRepo || '';
            if (run._hfOwner && run._hfRepo) {
              td.title = `${run._hfOwner}/${run._hfRepo}`;
              td.style.cursor = 'pointer';
              td.addEventListener('click', () => {
                window.open(`https://huggingface.co/${run._hfOwner}/${run._hfRepo}`, '_blank');
              });
            }
            break;
          case 'hf_revision':
            td.textContent = run._hfRevision || '';
            break;
          default:
            td.textContent = run[col.key] ?? '';
        }
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }

    $('tableCount').textContent = tableRuns.length;
  }

  // ---- Status ----

  function setStatus(type, text) {
    const dot = $('statusDot');
    const txt = $('statusText');
    dot.className = 'status-dot ' + type;
    txt.textContent = text;
  }

  // ---- Export ----

  function exportPNG() {
    const plotDiv = document.querySelector('#chartContainer .plotly-chart');
    if (!plotDiv || typeof Plotly === 'undefined') return;
    Plotly.toImage(plotDiv, 'png', { width: 1200, height: 600, filename: 'benchmark' });
  }

  function exportSVG() {
    const plotDiv = document.querySelector('#chartContainer .plotly-chart');
    if (!plotDiv || typeof Plotly === 'undefined') return;
    Plotly.toImage(plotDiv, 'svg', { width: 1200, height: 600, filename: 'benchmark' });
  }

  function exportTSV() {
    const mode = $('chartMode').value;
    const exportRuns = filteredRuns.filter(run => {
      if (mode === 'prompt') return (run.n_prompt || 0) > 0 && (run.n_gen || 0) === 0;
      if (mode === 'gen') return (run.n_prompt || 0) === 0 && (run.n_gen || 0) > 0;
      return true;
    });

    const headers = ['Date', 'Model', 'Backend', 'Prompt', 'Gen', 'tgs', 'Stddev', 'Threads', 'GPU Layers', 'Source'];
    const rows = [headers.join('\t')];

    for (const run of exportRuns) {
      const info = parseModelInfo(run);
      rows.push([
        run._sourceDate || '',
        `${info.family} ${info.size}`,
        run.backends,
        run.n_prompt || 0,
        run.n_gen || 0,
        (run.avg_ts || 0).toFixed(2),
        (run.stddev_ts || 0).toFixed(3),
        run.n_threads || '',
        run.n_gpu_layers ?? '',
        run._sourceFile || ''
      ].join('\t'));
    }

    downloadFile('benchmark.tsv', rows.join('\n'), 'text/tab-separated-values');
  }

  function generateMarkdown() {
    const mode = $('chartMode').value;
    const chartRuns = filteredRuns.filter(run => {
      if (mode === 'prompt') return (run.n_prompt || 0) > 0 && (run.n_gen || 0) === 0;
      if (mode === 'gen') return (run.n_prompt || 0) === 0 && (run.n_gen || 0) > 0;
      return true;
    });

    const chartType = $('chartType').value;
    const xAxis = $('chartXAxis').value;
    const yAxis = $('chartYAxis').value;

    let md = `# Benchmark Comparison\n\n`;
    md += `> Auto-generated on ${new Date().toISOString().split('T')[0]}\n`;
    md += `> Mode: ${mode === 'prompt' ? 'Prompt Processing' : mode === 'gen' ? 'Token Generation' : 'All'}\n`;
    md += `> Filtered runs: ${chartRuns.length}\n\n`;

    // Summary table
    const groups = {};
    for (const run of chartRuns) {
      const key = getGroupKey(run);
      if (!groups[key]) groups[key] = [];
      groups[key].push(run);
    }

    md += `## Summary\n\n`;
    md += `| Config | Runs | Avg TGS | Min TGS | Max TGS |\n`;
    md += `|--------|------|---------|---------|--------|\n`;

    for (const [name, runs] of Object.entries(groups)) {
      const tgsValues = runs.map(r => r.avg_ts || 0);
      const avg = tgsValues.reduce((a, b) => a + b, 0) / tgsValues.length;
      md += `| ${name} | ${runs.length} | ${avg.toFixed(1)} | ${Math.min(...tgsValues).toFixed(1)} | ${Math.max(...tgsValues).toFixed(1)} |\n`;
    }

    md += `\n## Charts\n\n`;
    md += `<!-- Export charts using the Export SVG button and paste them here -->\n`;

    // Also include raw data as TSV
    md += `\n## Raw Data\n\n`;
    md += '```tsv\n';
    const tsvHeaders = ['Date', 'Model', 'Backend', 'Prompt', 'Gen', 'tgs', 'Stddev', 'Threads', 'Source'];
    md += tsvHeaders.join('\t') + '\n';
    for (const run of chartRuns) {
      const info = parseModelInfo(run);
      md += [
        run._sourceDate || '',
        `${info.family} ${info.size}`,
        run.backends,
        run.n_prompt || 0,
        run.n_gen || 0,
        (run.avg_ts || 0).toFixed(2),
        (run.stddev_ts || 0).toFixed(3),
        run.n_threads || '',
        run._sourceFile || ''
      ].join('\t') + '\n';
    }
    md += '```\n';

    showModal('Generate benchmarks.md', md);
  }

  function downloadFile(filename, content, mimeType) {
    const blob = new Blob([content], { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  }

  // ---- Modal ----

  function showModal(title, content) {
    $('modalTitle').textContent = title;
    $('modalContent').textContent = content;
    $('modalOverlay').classList.remove('hidden');
  }

  function hideModal() {
    $('modalOverlay').classList.add('hidden');
  }

  // ---- Column toggle ----

  function buildColumnToggles() {
    const container = $('columnToggles');
    container.innerHTML = '';
    for (const col of COLUMNS) {
      const label = document.createElement('label');
      label.style.cssText = 'display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = columnVisibility[col.id];
      cb.dataset.col = col.id;
      cb.addEventListener('change', () => {
        columnVisibility[col.id] = cb.checked;
        updateTable();
        saveSettings();
      });
      label.appendChild(cb);
      label.appendChild(document.createTextNode(col.label));
      container.appendChild(label);
    }
  }

  function showColumnModal() {
    buildColumnToggles();
    $('columnModalOverlay').classList.remove('hidden');
  }

  function hideColumnModal() {
    $('columnModalOverlay').classList.add('hidden');
  }

  // ---- Event bindings ----

  function bindEvents() {
    // Data loading
    $('btnSelectFolder').addEventListener('click', selectFolder);
    $('btnLoadFromServer').addEventListener('click', loadFromServer);

    // Filters — all dropdowns cross-constrain each other
    const filterIds = ['filterHfOwner', 'filterHfRepo', 'filterHfRevision',
                       'filterBackend', 'filterModel', 'filterQuant', 'filterVersion'];
    filterIds.forEach(id => {
      $(id).addEventListener('change', (e) => {
        // Get candidates from all OTHER filter selections, repopulate all dropdowns,
        // then apply the full filter set including the changed one
        // e.target.value is the new value (browser may not have updated DOM yet)
        const newValue = e.target.value;
        const candidates = getRunsMatchingFilters(id, newValue);
        populateAllFromRuns(candidates);
        applyFilters();
        saveSettings();
      });
    });
    // Date inputs: show formatted display, sync on change
    $('filterDateFrom').addEventListener('change', () => {
      setFilterDate('filterDateFrom', $('filterDateFrom').value);
      populateAllFromRuns(getRunsMatchingFilters('', ''));
      applyFilters(); saveSettings();
    });
    $('filterDateTo').addEventListener('change', () => {
      setFilterDate('filterDateTo', $('filterDateTo').value);
      populateAllFromRuns(getRunsMatchingFilters('', ''));
      applyFilters(); saveSettings();
    });
    // Click display to open date picker
    $('filterDateFromDisplay').addEventListener('click', () => {
      const inp = $('filterDateFrom');
      if (inp.showPicker) inp.showPicker(); else inp.click();
    });
    $('filterDateToDisplay').addEventListener('click', () => {
      const inp = $('filterDateTo');
      if (inp.showPicker) inp.showPicker(); else inp.click();
    });
    $('btnClearFilters').addEventListener('click', () => {
      $('filterHfOwner').value = '';
      $('filterHfRepo').value = '';
      $('filterHfRevision').value = '';
      $('filterBackend').value = '';
      $('filterModel').value = '';
      $('filterQuant').value = '';
      $('filterVersion').value = '';
      $('filterDateFrom').value = '';
      $('filterDateTo').value = '';
      populateFilters();
      applyFilters(); saveSettings();
    });

    // Chart controls
    $('chartMode').addEventListener('change', () => {
      const mode = $('chartMode').value;
      const xSel = $('chartXAxis');
      const resetBtn = $('btnResetXAxis');

      // Hide/show x-axis options based on mode
      const promptOpt = xSel.querySelector('option[value="n_prompt"]');
      const genOpt = xSel.querySelector('option[value="n_gen"]');

      promptOpt.style.display = mode === 'gen' ? 'none' : '';
      genOpt.style.display = mode === 'prompt' ? 'none' : '';

      // Adjust selected value if current selection is hidden
      if (mode === 'prompt' && xSel.value === 'n_gen') {
        xSel.value = 'n_prompt';
      } else if (mode === 'gen' && xSel.value === 'n_prompt') {
        xSel.value = 'n_gen';
      }

      // Show reset button when mode restricts options
      resetBtn.style.display = mode === 'all' ? 'none' : 'inline-flex';

      renderChart(); updateTable(); saveSettings();
    });
    ['chartType', 'chartXAxis', 'chartYAxis'].forEach(id => {
      $(id).addEventListener('change', () => { renderChart(); saveSettings(); });
    });
    $('btnResetXAxis').addEventListener('click', () => {
      $('chartXAxis').value = 'n_prompt';
      renderChart(); saveSettings();
    });

    // Data path
    $('dataPath').addEventListener('change', saveSettings);

    // Export
    $('btnExportPNG').addEventListener('click', exportPNG);
    $('btnExportSVG').addEventListener('click', exportSVG);
    $('btnExportTSV').addEventListener('click', exportTSV);
    $('btnGenMd').addEventListener('click', generateMarkdown);

    // Panel toggle
    $('filterPanelHeader').addEventListener('click', () => {
      $('filterPanelBody').classList.toggle('collapsed');
      $('filterToggle').textContent = $('filterPanelBody').classList.contains('collapsed') ? '▶' : '▼';
    });

    $('tableHeader').addEventListener('click', () => {
      $('tableBody').classList.toggle('collapsed');
      $('tableToggle').textContent = $('tableBody').classList.contains('collapsed') ? '▶' : '▼';
    });

    // Table sorting
    $('dataTable').querySelectorAll('th[data-sort]').forEach(th => {
      th.addEventListener('click', () => {
        const col = th.dataset.sort;
        if (sortColumn === col) {
          sortAsc = !sortAsc;
        } else {
          sortColumn = col;
          sortAsc = col === 'test_time' || col === '_sourceDate';
        }
        // Update arrow indicators
        $('dataTable').querySelectorAll('th').forEach(h => {
          h.textContent = h.textContent.replace(/ [↑↓]$/, '');
        });
        th.textContent = th.textContent.trim() + (sortAsc ? ' ↑' : ' ↓');
        updateTable();
      });
    });

    // Auto-refresh
    $('autoRefreshInterval').addEventListener('change', () => {
      const ms = parseInt($('autoRefreshInterval').value);
      if (refreshTimer) clearInterval(refreshTimer);
      if (ms > 0) {
        refreshTimer = setInterval(refreshData, ms);
      }
    });

    // Share
    $('btnShare').addEventListener('click', shareSettings);

    // Columns
    $('btnColumns').addEventListener('click', showColumnModal);
    $('btnCloseCols').addEventListener('click', hideColumnModal);
    $('btnSelectAllCols').addEventListener('click', () => {
      COLUMNS.forEach(col => { columnVisibility[col.id] = true; });
      buildColumnToggles();
      updateTable();
      saveSettings();
    });
    $('btnDeselectAllCols').addEventListener('click', () => {
      COLUMNS.forEach(col => { columnVisibility[col.id] = false; });
      buildColumnToggles();
      updateTable();
      saveSettings();
    });
    $('columnModalOverlay').addEventListener('click', (e) => {
      if (e.target === $('columnModalOverlay')) hideColumnModal();
    });

    // Reset
    $('btnResetSettings').addEventListener('click', clearSettings);

    // Modal
    $('btnCloseModal').addEventListener('click', hideModal);
    $('btnCopyModal').addEventListener('click', () => {
      copyText($('modalContent').textContent, $('btnCopyModal'));
    });
    $('modalOverlay').addEventListener('click', (e) => {
      if (e.target === $('modalOverlay')) hideModal();
    });

    // Keyboard
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        hideColumnModal();
        hideModal();
      }
    });
  }

  // ---- Init ----

  function init() {
    bindEvents();

    // Load settings from URL/hash/localStorage
    const settings = loadSettings();
    if (settings) {
      applySettings(settings);
    }

    // Default data path hints based on environment (only if no settings loaded)
    const hostname = window.location.hostname;
    if (hostname === 'localhost' || hostname === '127.0.0.1') {
      if (!$('dataPath').value) {
        $('dataPath').value = '/data/';
      }
    }

    // Auto-load from server if data path is set
    const dataPath = $('dataPath').value.replace(/\/$/, '');
    if (dataPath) {
      loadFromServer();
    } else {
      setStatus('ready', 'Select a data folder or load from server to begin');
    }
  }

  // Start when DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
</body>
</html>
