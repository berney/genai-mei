x-engine-rocm7-nightlies: &x-engine-rocm7-nightlies
  <<: *x-engine
  image: berne/amd-strix-halo-toolboxes:rocm7-nightlies
  build:
    context: amd-strix-halo-toolboxes
    args:
      TAG: rocm7-nightlies

x-model: &x-model
  # FML not all arguments have env var equivalents: warmup, temp, top-p, min-p, typical
  command: >-
    llama-server
    --no-warmup
    --temp 0.3
    --top-p 0.95
    --min-p 0.05
    --typical 0.95
  environment: &x-model-env
    LLAMA_ARG_FLASH_ATTN: auto
    LLAMA_ARG_HOST: 0.0.0.0
    LLAMA_ARG_CONT_BATCHING: on
    LLAMA_ARG_N_PARALLEL: 1
    LLAMA_ARG_N_GPU_LAYERS: all
    LLAMA_ARG_CONTEXT_SHIFT: on
    LLAMA_ARG_CTX_SIZE: 32768

x-model-benchmark: &x-model-benchmark
  <<: *x-model
  # Use wrapper so we can use env var LLAMA_ARG_MODEL
  command: >-
    llama-bench-wrapper
    -ngl 999
    --no-warmup
    --flash-attn on
    -p 512,1024,2048
    -n 128
    -o json
    -oe md
  #  -o jsonl

x-model-vulkan-radv: &x-model-vulkan-radv
  <<: [*x-model, *x-engine-vulkan-radv]
  profiles:
