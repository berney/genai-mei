volumes:
  openwebui-data:
  vane-uploads:

services:
  searxng:
    profiles:
      # implicit default
      - ""
    image: docker.io/searxng/searxng:latest
    #container_name: searxng
    ports:
      - "8185:8080"
    volumes:
      - ./searxng:/etc/searxng:Z
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/sbin/wget", "-q", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

  # new name of perplexica
  vane:
    profiles:
      # implicit default
      - ""
    # tag `latest` has a builtin SearxNG
    # tag `slim-latest` doesn't
    image: docker.io/itzcrazykns1337/vane:slim-latest
    volumes:
      - ./vane/data:/home/vane/data:Z
      - vane-uploads:/home/vane/uploads:Z
    environment:
      - SEARXNG_API_URL=http://searxng:8080
      - PORT=3001
      - HOSTNAME=0.0.0.0
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      - searxng
      - llama-swap

  llama-swap:
    profiles:
      # implicit default
      - ""
    # vulkan for AMD Strix Halo
    build: llama-swap
    #image: ghcr.io/mostlygeek/llama-swap:vulkan-non-root
    image: berne/llama-swap:vulkan-non-root
    #user: "1000:1000"
    userns_mode: keep-id
    # This is `ubuntu` user rather than `app` user.
    # Same UID as me, so my podman socket should work.
    #user: "1000:1000"
    user: bdawg
    environment:
      #HOME: /home/ubuntu
      HOME: /home/bdawg
      CONTAINER_HOST: unix:///run/user/1000/podman/podman.sock
    # configuration hot reload supported with a directory volume mount
    #command: >-
    #  -config /config/config.yaml
    #  -watch-config
    #image: ghcr.io/mostlygeek/llama-swap:vulkan-non-root
    devices:
      # Direct Rendering Infrastructure (dri) - exposes renderer nodes (renderD128) and compute shaders, used by Vulkan/Mesa
      - /dev/dri:/dev/dri
      # Kernel Fusion Driver (kfd) - primary compute interface - essential for HIP/ROCm
      - /dev/kfd:/dev/kfd
    group_add:
      # Unable to find group render: no matching entries in group file
      #- render
      - video
      - app
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
      - label=disable
    ports:
      - 8090:8080
    restart: unless-stopped
    working_dir: /genai-mei
    command: llama-swap -config config.yaml
    volumes:
      - ./llama-swap/config.yaml:/app/config.yaml:Z
    #  - ./config:/config
      - ${XDG_RUNTIME_DIR}/podman:/run/user/1000/podman:Z
      # The parent directory needs to match the host as docker-compose bases the container names off it
      - ./docker-compose.yml:/genai-mei/docker-compose.yml:ro
      #- ./models:/models:Z
      # Don't needed to mount as podman (compose) is doing bind mounts from hosts point of view
      # But the `~` in the docker-compose.yml (this file) should match in the container and host (e.g. `bdawg`)
      #- ~/.cache/huggingface:/huggingface:ro


  # Not really needed, llama-server has a build in web UI that's nearly as good.
  # But Conduit is made to work with Open WebUI
  # And I got full duplex voice conversations (STT->Reason->TTS) working in Open WebUI
  # OpenWebUI takes about 813MiB of RAM
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    profiles:
      # implicit default
      - ""
    ports:
      - 8080:8080
    volumes:
      - openwebui-data:/app/backend/data:Z
    environment:
      #OPENAI_API_BASE_URLS: http://localhost:8090/v1
      OPENAI_API_BASE_URLS: http://llama-swap:8080/v1
      OPENAI_API_KEYS: sk-llamaswap
      #RAG_EMBEDDING_ENGINE: openai
      #RAG_EMBEDDING_MODEL: bge-embed
      #RAG_OPENAI_API_BASE_URL: http://localhost:8090/v1
      #RAG_OPENAI_API_KEY: sk-llamaswap
      #RAG_RERANKING_ENGINE: external
      #RAG_RERANKING_MODEL: bge-rerank
      #RAG_EXTERNAL_RERANKER_URL: http://localhost:10002/v1/rerank
      #RAG_EXTERNAL_RERANKER_API_KEY: sk-llamaswap
      #ENABLE_RAG_WEB_SEARCH: "true"
      #RAG_WEB_SEARCH_ENGINE: searxng
      #SEARXNG_QUERY_URL: http://localhost:8085/search?q=<query>
      ENABLE_OLLAMA_API: "false"
      # Speech to Text (STT)
      #AUDIO_STT_ENGINE: openai
      #AUDIO_STT_OPENAI_API_BASE_URL: http://llama-swap:8080/v1
      #AUDIO_STT_OPENAI_API_KEYS: sk-llamaswap
    restart: unless-stopped
    #depends_on:
    #  - llama-swap

  #context7-mcp:
  #  image: berne/context7-mcp
  #  profiles:
  #    # implicit default
  #    - ""
  #  ports:
  #    - 3000:3000


  # ==============================================================================================================================================================
  # whisper.cpp
  # ==============================================================================================================================================================
  whisper.cpp:
    profiles:
      - whisper
    image: ghcr.io/ggml-org/whisper.cpp:main-vulkan
    userns_mode: keep-id
    # Command Line
    # - entrypoint is `bash -c` so need the quotes
    # - need to listen on 0.0.0.0 so host can connect to docker published port
    # - OpenAPI Compatibility set request path and inference path
    #   https://github.com/mostlygeek/llama-swap/issues/41#issuecomment-2722637867
    command: >-
      "whisper-server --host 0.0.0.0 -m /models/ggml-large-v3-turbo-q5_0.bin --request-path /v1/audio/transcriptions --inference-path '' --vad --vad-model /models/ggml-silero-v6.2.0.bin"
    #  "whisper-server --host 0.0.0.0 -m /models/ggml-large-v3-turbo-q5_0.bin --request-path /v1/audio/transcriptions --inference-path ''"
    #  "whisper-server --host 0.0.0.0 -m /models/ggml-large-v3-turbo-q5_0.bin"
    #  "whisper-server --host 0.0.0.0 -m /models/ggml-base.en.bin"
    #  "whisper-server --host 0.0.0.0 -m /models/ggml-large-v3.bin"
    devices:
      # Direct Rendering Infrastructure (dri) - exposes renderer nodes (renderD128) and compute shaders, used by Vulkan/Mesa
      - /dev/dri:/dev/dri
      # Kernel Fusion Driver (kfd) - primary compute interface - essential for HIP/ROCm
      - /dev/kfd:/dev/kfd
    #group_add:
    #  - video
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
      - label=disable
    ports:
      - "8999:8080"
    #working_dir: /genai-mei
    volumes:
      # From host's perspecitve
      #- ./whisper-models:/models:Z
      # From llama-swap's perspective
      #- /tmp/whisper-models:/models:Z
      #
      # Podman CLI (client-side) will create the source directory if it doesn't exist (think inside the llama-swap container)
      # So, the parent directory chain needs to be R/W.
      # The actual mount will happen on the host (podman daemon listening on the socket)
      # So, we give a source path that is both correct from hosts POV and writable from llama-servers POV
      - ~/genai/genai-mei/whisper-models:/models:ro

  whisper-bench:
    profiles:
      - whisper-bench
    image: ghcr.io/ggml-org/whisper.cpp:main-vulkan
    userns_mode: keep-id
    # entrypoint is `bash -c` so need the quotes
    # need to listen on 0.0.0.0 so host can connect to docker published port
    #command: >-
    #  "whisper-server --host 0.0.0.0 -m /models/ggml-base.en.bin"
    command: >-
      "whisper-bench -m /models/ggml-large-v3-turbo-q5_0.bin -t 8"
    #  "whisper-bench -m /models/ggml-small.en.bin -t 4"
    #  "whisper-bench -m /models/ggml-large-v3.bin -t 8"
    #  "whisper-bench -m /models/ggml-large-v3-turbo.bin -t 8"
    #  "whisper-bench -m /models/ggml-large-v3-turbo-q8_0.bin -t 8"
    devices:
      # Direct Rendering Infrastructure (dri) - exposes renderer nodes (renderD128) and compute shaders, used by Vulkan/Mesa
      - /dev/dri:/dev/dri
      # Kernel Fusion Driver (kfd) - primary compute interface - essential for HIP/ROCm
      - /dev/kfd:/dev/kfd
    #group_add:
    #  - video
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
      - label=disable
    #working_dir: /genai-mei
    volumes:
      # From host's perspecitve
      - ./whisper-models:/models:Z
      # From llama-swap's perspective
      #- /whisper-models:/models:Z

  whisper-download:
    profiles:
      - whisper-download
    image: ghcr.io/ggml-org/whisper.cpp:main-vulkan
    userns_mode: keep-id
    # entrypoint is `bash -c` so need the quotes
    volumes:
      - ./whisper-models:/models:Z
    command: >-
      "./models/download-vad-model.sh silero-v6.2.0 /models"
    #  "./models/download-ggml-model.sh base /models"
    #  "./models/download-ggml-model.sh base.en /models"
    #  "./models/download-ggml-model.sh small /models"
    #  "./models/download-ggml-model.sh small.en /models"
    #  "./models/download-ggml-model.sh small.en-tdrz /models"
    #  "./models/download-ggml-model.sh medium /models"
    #  "./models/download-ggml-model.sh medium.en /models"
    #  "./models/download-ggml-model.sh large-v3 /models"
    #  "./models/download-ggml-model.sh large-v3-turbo /models"
    #  "./models/download-ggml-model.sh large-v3-turbo-q8_0 /models"
    #  "./models/download-ggml-model.sh large-v3-turbo-q5_0 /models"

