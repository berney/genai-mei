volumes:
  openwebui-data:
  perplexica-uploads:

services:
  searxng:
    profiles:
      # implicit default
      - ""
    image: docker.io/searxng/searxng:latest
    #container_name: searxng
    ports:
      - "8185:8080"
    volumes:
      - ./searxng:/etc/searxng:Z
    #restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/sbin/wget", "-q", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

  perplexica:
    profiles:
      # implicit default
      - ""
    # tag `latest` has a builtin SearxNG
    # tag `slim-latest` doesn't
    image: docker.io/itzcrazykns1337/perplexica:slim-latest
    #container_name: perplexica
    #network_mode: host
    volumes:
      - ./perplexica/data:/home/perplexica/data:Z
      - perplexica-uploads:/home/perplexica/uploads:Z
    environment:
      - SEARXNG_API_URL=http://searxng:8080
      - PORT=3001
      - HOSTNAME=0.0.0.0
    #restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      - searxng
      - llama-swap

  llama-swap:
    profiles:
      # implicit default
      - ""
    # vulkan for AMD Strix Halo
    build: llama-swap
    #image: ghcr.io/mostlygeek/llama-swap:vulkan-non-root
    image: berne/llama-swap:vulkan-non-root
    #user: "1000:1000"
    userns_mode: keep-id
    # This is `ubuntu` user rather than `app` user.
    # Same UID as me, so my podman socket should work.
    #user: "1000:1000"
    user: bdawg
    environment:
      #HOME: /home/ubuntu
      HOME: /home/bdawg
      CONTAINER_HOST: unix:///run/user/1000/podman/podman.sock
    # configuration hot reload supported with a directory volume mount
    #command: >-
    #  -config /config/config.yaml
    #  -watch-config
    #image: ghcr.io/mostlygeek/llama-swap:vulkan-non-root
    devices:
      # Direct Rendering Infrastructure (dri) - exposes renderer nodes (renderD128) and compute shaders, used by Vulkan/Mesa
      - /dev/dri:/dev/dri
      # Kernel Fusion Driver (kfd) - primary compute interface - essential for HIP/ROCm
      - /dev/kfd:/dev/kfd
    group_add:
      # Unable to find group render: no matching entries in group file
      #- render
      - video
      - app
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
      - label=disable
    ports:
      - 8090:8080
    working_dir: /genai-mei
    command: llama-swap -config config.yaml
    volumes:
      - ./llama-swap/config.yaml:/app/config.yaml:Z
    #  - ./config:/config
      - ${XDG_RUNTIME_DIR}/podman:/run/user/1000/podman:Z
      # The parent directory needs to match the host as docker-compose bases the container names off it
      - ./docker-compose.yml:/genai-mei/docker-compose.yml:ro
      #- ./models:/models:Z
      # Don't needed to mount as podman (compose) is doing bind mounts from hosts point of view
      # But the `~` in the docker-compose.yml (this file) should match in the container and host (e.g. `bdawg`)
      #- ~/.cache/huggingface:/huggingface:ro


  # Not really needed, llama-server has a build in web UI that's nearly as good.
  # OpenWebUI takes about 813MiB of RAM
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    profiles:
      - open-webui
    #network_mode: host
    #container_name: open-webui
    ports:
      - 8080:8080
    volumes:
      - openwebui-data:/app/backend/data:Z
    environment:
      #OPENAI_API_BASE_URLS: http://localhost:8090/v1
      OPENAI_API_BASE_URLS: http://llama-swap:8080/v1
      OPENAI_API_KEYS: sk-llamaswap
      #RAG_EMBEDDING_ENGINE: openai
      #RAG_EMBEDDING_MODEL: bge-embed
      #RAG_OPENAI_API_BASE_URL: http://localhost:8090/v1
      #RAG_OPENAI_API_KEY: sk-llamaswap
      #RAG_RERANKING_ENGINE: external
      #RAG_RERANKING_MODEL: bge-rerank
      #RAG_EXTERNAL_RERANKER_URL: http://localhost:10002/v1/rerank
      #RAG_EXTERNAL_RERANKER_API_KEY: sk-llamaswap
      #ENABLE_RAG_WEB_SEARCH: "true"
      #RAG_WEB_SEARCH_ENGINE: searxng
      #SEARXNG_QUERY_URL: http://localhost:8085/search?q=<query>
      ENABLE_OLLAMA_API: "false"
    #restart: unless-stopped
    #depends_on:
    #  - llama-swap


  # huggingface CLI
  # Use to download models
  # TODO: Capture downloading the models as code
  facehugger:
    userns_mode: keep-id
    profiles:
      - facehugger
      - bootstrap
    image: berne/facehugger
    #command: >-
    #  hf download bartowski/kldzj_gpt-oss-120b-heretic-GGUF/tree/main/kldzj_gpt-oss-120b-heretic-bf16
    volumes:
      - ~/.cache/huggingface:/home/bdawg/.cache/huggingface:Z
      - ./facehugger/facehugger.yaml:/facehugger.yaml


  mistral-vibe:
    profiles:
      - mistral-vibe
    build: mistral-vibe
    image: berne/mistral-vibe


  # --------------------------------------------------------------------------------
  # Models
  # --------------------------------------------------------------------------------

  x-model-base: &model-base
    profiles:
      - x-model-base
    image: berne/amd-strix-halo-toolboxes:vulkan-radv
    build: amd-strix-halo-toolboxes
    devices:
      # Direct Rendering Infrastructure (dri) - exposes renderer nodes (renderD128) and compute shaders, used by Vulkan/Mesa
      - /dev/dri:/dev/dri
      # Kernel Fusion Driver (kfd) - primary compute interface - essential for HIP/ROCm
      - /dev/kfd:/dev/kfd
    group_add:
      - render
      - video
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
      - label=disable
    environment: &model-base-env
      #LLAMA_CACHE: /models
      GGML_VERBOSE: 1
      # Jesse: Do NOT set `HSA_OVERRIDE_GFX_VERSION` - causes kernel mismatches on Strix Halo
      #HSA_OVERRIDE_GFX_VERSION: 11.0.2
      ROCBLAS_LAYER: 4
      # Jesse: in ROCm containers to prevent DMA issues
      HSA_ENABLE_SDMA: 0
      LLAMA_ARG_MODEL: /huggingface/hub/models--bartowski--kldzj_gpt-oss-120b-heretic-GGUF/snapshots/406292f67859a86dd34853c75b573aadedf6cbda/kldzj_gpt-oss-120b-heretic-bf16/kldzj_gpt-oss-120b-heretic-bf16-00001-of-00002.gguf
    volumes:
      #- ./models:/models:Z
      - ~/.cache/huggingface:/huggingface:ro

  x-model: &model
    <<: *model-base
    profiles:
      - x-model
    # FML not all arguments have env var equivalents: warmup, temp, top-p, min-p, typical
    command: >-
      llama-server
      --no-warmup
      --temp 0.3
      --top-p 0.95
      --min-p 0.05
      --typical 0.95
    environment: &model-env
      <<: *model-base-env
      LLAMA_ARG_FLASH_ATTN: auto
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_CONT_BATCHING: on
      LLAMA_ARG_N_PARALLEL: 1
      LLAMA_ARG_N_GPU_LAYERS: all
      LLAMA_ARG_CONTEXT_SHIFT: on
      LLAMA_ARG_CTX_SIZE: 32768


  x-model-benchmark: &model-benchmark
    <<: *model-base
    profiles:
      - x-model-benchmark
    # Use wrapper so we can use env var LLAMA_ARG_MODEL
    command: >-
      llama-bench-wrapper
      -ngl 999
      --no-warmup
      --flash-attn on
      -p 512,1024,2048
      -n 128

  # large uncensored model
  # bdawg: Would Q8_0 be better? The GPU has bf16: 0
  heretic-gpt-oss-120b:
    <<: *model
    profiles:
      - model-heretic-gpt-oss-120b
    environment: &heretic-gpt-oss-120b-env
      <<: *model-env
      LLAMA_ARG_MODEL: /huggingface/hub/models--bartowski--kldzj_gpt-oss-120b-heretic-GGUF/snapshots/406292f67859a86dd34853c75b573aadedf6cbda/kldzj_gpt-oss-120b-heretic-bf16/kldzj_gpt-oss-120b-heretic-bf16-00001-of-00002.gguf
      LLAMA_ARG_PORT: 8120
    ports:
      - 8120:8120

  heretic-gpt-oss-120b-benchmark:
    <<: *model-benchmark
    profiles:
      - heretic-gpt-oss-120b-benchmark
      - benchmark
    environment:
      <<: *heretic-gpt-oss-120b-env

  qwen-coder-30b:
    <<: *model
    environment: &qwen-coder-30b-env
      <<: *model-env
      LLAMA_ARG_MODEL: /huggingface/hub/models--unsloth--Qwen3-Coder-30B-A3B-Instruct-GGUF/snapshots/7ce945e58ed3f09f9cf9c33a2122d86ac979b457/Qwen3-Coder-30B-A3B-Instruct-Q8_0.gguf
      LLAMA_ARG_PORT: 8130
    ports:
      - 8130:8130

  qwen-coder-30b-benchmark:
    <<: *model-benchmark
    profiles:
      - qwen-coder-30b-benchmark
      - benchmark
    environment:
      <<: *qwen-coder-30b-env

  # primary coding model
  glm-4.7-flash:
    <<: *model
    command: &coder-env >-
      llama-server
      --no-warmup
      --temp 0.3
      --top-p 1.0
      --min-p 0.01
      --typical 0.95
      --repeat-penalty 1.0
    environment: &glm-4.7-flash-env
      <<: *model-env
      LLAMA_ARG_MODEL: /huggingface/hub/models--unsloth--GLM-4.7-Flash-GGUF/snapshots/66205ea11ef638d83850389bd921e6c199f7504e/GLM-4.7-Flash-UD-Q8_K_XL.gguf
      LLAMA_ARG_PORT: 8140
      LLAMA_ARG_CTX_SIZE: 202752
    ports:
      - 8140:8140

  glm-4.7-flash-benchmark:
    <<: *model-benchmark
    profiles:
      - glm-4.7-flash-benchmark
      - benchmark
    # No env vars for several options
    # https://unsloth.ai/docs/models/glm-4.7-flash
    environment:
      <<: *glm-4.7-flash-env


    # XXX TODO Add more models - see Jesse's llama-swap config
