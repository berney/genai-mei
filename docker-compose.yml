    # Once a field is set any dupes are ignored.
    <<: [*x-model-rocm-6.4.4, *heretic-gpt-oss-120b]
    # x-model-base-vulkan-amdvlk inherits model-base that sets environ
    # So we need to override it here
    environment:
      <<: *heretic-gpt-oss-120b-env

