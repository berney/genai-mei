    environment:
      <<: *heretic-gpt-oss-120b-env

  heretic-gpt-oss-120b-vulkan-amdvlk:
    # Merge precedence is (preferred) parent, first, to last.
    # Once a field is set any dupes are ignored.
    <<: [*x-model-vulkan-amdvlk, *heretic-gpt-oss-120b]
    # x-model-vulkan-amdvlk sets environ
    # So we need to override it here
    environment:
      <<: *heretic-gpt-oss-120b-env

  heretic-gpt-oss-120b-vulkan-amdvlk-benchmark:
    <<: *x-model-benchmark-vulkan-amdvlk
    environment:
      <<: *heretic-gpt-oss-120b-env

  heretic-gpt-oss-120b-rocm-6.4.4:
    # Merge precedence is (preferred) parent, first, to last.
    # Once a field is set any dupes are ignored.
    <<: [*x-model-rocm-6.4.4, *heretic-gpt-oss-120b]
    # x-model-base-vulkan-amdvlk inherits model-base that sets environ
    # So we need to override it here
    environment:
      <<: *heretic-gpt-oss-120b-env

  heretic-gpt-oss-120b-rocm-6.4.4-benchmark:
    <<: *x-model-benchmark-rocm-6.4.4
    environment:
      <<: *heretic-gpt-oss-120b-env

  heretic-gpt-oss-120b-rocm-7.2:
    # Merge precedence is (preferred) parent, first, to last.
    # Once a field is set any dupes are ignored.
    <<: [*x-model-rocm-7.2, *heretic-gpt-oss-120b]
    # x-model-base-vulkan-amdvlk inherits model-base that sets environ
    # So we need to override it here
    environment:
      <<: *heretic-gpt-oss-120b-env

  heretic-gpt-oss-120b-rocm-7.2-benchmark:
    <<: *x-model-benchmark-rocm-7.2
    environment:
      <<: *heretic-gpt-oss-120b-env

  heretic-gpt-oss-120b-rocm-722:
    # Merge precedence is (preferred) parent, first, to last.
    # Once a field is set any dupes are ignored.
    <<: [*x-model-rocm-722, *heretic-gpt-oss-120b]
    # x-model-base-vulkan-amdvlk inherits model-base that sets environ
    # So we need to override it here
    environment:
      <<: *heretic-gpt-oss-120b-env

  heretic-gpt-oss-120b-rocm-722-benchmark:
    <<: *x-model-benchmark-rocm-722
    environment:
      <<: *heretic-gpt-oss-120b-env

  heretic-gpt-oss-120b-rocm-723:
