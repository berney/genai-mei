# extensions
# https://docs.docker.com/reference/compose-file/extension/
# Prefixed these with `x-`

# Inference Engines (Runtimes)
x-engine: &x-engine
  devices:
    # Direct Rendering Infrastructure (dri) - exposes renderer nodes (renderD128) and compute shaders, used by Vulkan/Mesa
    - /dev/dri:/dev/dri
    # Kernel Fusion Driver (kfd) - primary compute interface - essential for HIP/ROCm
    - /dev/kfd:/dev/kfd
  group_add:
    - render
    - video
  security_opt:
    - seccomp:unconfined
    - apparmor:unconfined
    - label=disable
  environment: &x-engine-env
    #LLAMA_CACHE: /models
    GGML_VERBOSE: 1
    # Jesse: Do NOT set `HSA_OVERRIDE_GFX_VERSION` - causes kernel mismatches on Strix Halo
    #HSA_OVERRIDE_GFX_VERSION: 11.0.2
    ROCBLAS_LAYER: 4
    # Jesse: in ROCm containers to prevent DMA issues
    HSA_ENABLE_SDMA: 0
    LLAMA_ARG_MODEL: /huggingface/hub/models--bartowski--kldzj_gpt-oss-120b-heretic-GGUF/snapshots/406292f67859a86dd34853c75b573aadedf6cbda/kldzj_gpt-oss-120b-heretic-bf16/kldzj_gpt-oss-120b-heretic-bf16-00001-of-00002.gguf
  volumes:
    #- ./models:/models:Z
    - ~/.cache/huggingface:/huggingface:ro

x-engine-vulkan-radv: &x-engine-vulkan-radv
  <<: *x-engine
  image: berne/amd-strix-halo-toolboxes:vulkan-radv
  build:
    context: amd-strix-halo-toolboxes
    args:
      TAG: vulkan-radv

x-engine-vulkan-amdvlk: &x-engine-vulkan-amdvlk
  <<: *x-engine
  image: berne/amd-strix-halo-toolboxes:vulkan-amdvlk
  build:
    context: amd-strix-halo-toolboxes
    args:
      TAG: vulkan-amdvlk

x-engine-rocm-6.4.4: &x-engine-rocm-6.4.4
  <<: *x-engine
  image: berne/amd-strix-halo-toolboxes:rocm-6.4.4
  build:
    context: amd-strix-halo-toolboxes
    args:
      TAG: rocm-6.4.4

x-engine-rocm-7.2: &x-engine-rocm-7.2
  <<: *x-engine
  image: berne/amd-strix-halo-toolboxes:rocm-7.2
