    environment:
      <<: *heretic-gpt-oss-120b-env

  heretic-gpt-oss-120b-rocm-7.2-benchmark:
    <<: *x-model-benchmark-rocm-7.2
    environment:
      <<: *heretic-gpt-oss-120b-env

  heretic-gpt-oss-120b-rocm7-nightlies:
    # Merge precedence is (preferred) parent, first, to last.
    # Once a field is set any dupes are ignored.
    <<: [*x-model-rocm7-nightlies, *heretic-gpt-oss-120b]
    # x-model-base-vulkan-amdvlk inherits model-base that sets environ
    # So we need to override it here
    environment:
      <<: *heretic-gpt-oss-120b-env

  heretic-gpt-oss-120b-rocm7-nightlies-benchmark:
    <<: *x-model-benchmark-rocm7-nightlies
    environment:
      <<: *heretic-gpt-oss-120b-env


  # Quannt Q8_0
  heretic-gpt-oss-120b-q8:
    <<: *x-model-vulkan-radv
    #profiles:
    #  - model-heretic-gpt-oss-120b-q8
    environment: &heretic-gpt-oss-120b-q8-env
      <<: *x-model-vulkan-radv-env
      LLAMA_ARG_MODEL: /huggingface/hub/models--bartowski--kldzj_gpt-oss-120b-heretic-GGUF/snapshots/406292f67859a86dd34853c75b573aadedf6cbda/kldzj_gpt-oss-120b-heretic-Q8_0/kldzj_gpt-oss-120b-heretic-Q8_0-00001-of-00002.gguf
      # default is 8080
      #LLAMA_ARG_PORT: 8120
    ports:
      - 8121:8080

  heretic-gpt-oss-120b-q8-benchmark:
    <<: *x-model-benchmark-vulkan-radv
    environment:
      <<: *heretic-gpt-oss-120b-q8-env

  qwen-coder-30b:
    <<: *x-model-vulkan-radv
    environment: &qwen-coder-30b-env
